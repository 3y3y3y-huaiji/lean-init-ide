name: CI · 应用
run-name: CI · ${{ github.ref_name }} · ${{ github.event_name }}

# PR 走本工作流；deploy.yml 在 direct push 时复用本工作流，PR 合并则直接部署。
on:
  pull_request:
  workflow_dispatch:
  # 允许 deploy.yml 在 direct push 时复用同一套检查。
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: 静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 主机参数
        uses: ./.github/actions/host-info
      - uses: pnpm/action-setup@v6
        with:
          version: 12.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 代码格式
        run: pnpm run format:check
      - name: ESLint
        run: pnpm run lint
      - name: 类型检查（应用 / Service Worker / Pages Functions）
        run: pnpm run typecheck
      - name: 资产清单结构
        run: pnpm run verify:manifest

  actionlint:
    name: Actions 工作流静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # 固定版本，避免 latest 变更导致流水线突然变红。
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7

  test:
    name: 单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 主机参数
        uses: ./.github/actions/host-info
      - uses: pnpm/action-setup@v6
        with:
          version: 12.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 覆盖率阈值写在 vitest.config.ts，低于阈值即失败。
      - run: pnpm test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  build:
    name: 构建产物
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 主机参数
        uses: ./.github/actions/host-info
      - uses: pnpm/action-setup@v6
        with:
          version: 12.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # build:web 跳过 102 MB 资产下载，运行时由 /cdn 网关按需拉取。
      - run: pnpm run build:web
      - name: 产物契约
        run: pnpm run verify:build
      # E2E 直接复用这份 dist，避免再跑一次 vite build，也保证测的是同一份产物。
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 1

  e2e:
    name: 浏览器端到端
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 主机参数
        uses: ./.github/actions/host-info
      - uses: pnpm/action-setup@v6
        with:
          version: 12.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      # 和 deploy 共用同一份资产缓存；命中时 fetch:assets 只做哈希校验。
      - name: 缓存 Lean 资产
        uses: actions/cache@v6
        with:
          path: public/wasm-lean4
          key: lean-assets-${{ hashFiles('config/lean4-runtime.json') }}
      - name: 准备 Lean 资产
        # 工程实战课直接编译 Std / Batteries，E2E 必须能像生产一样提供扩展分包。
        env:
          LEAN_FETCH_EXTENSIONS: '1'
        run: pnpm run fetch:assets
      # build:web 的 dist 不含 wasm-lean4；小资产（index.json/lean.mjs 等）不走 SW，
      # 必须补回静态副本，否则会落到网关的 SPA 回退。
      - name: 补齐静态兜底资产
        run: mkdir -p dist/wasm-lean4 && cp -r public/wasm-lean4/. dist/wasm-lean4/
      - name: 复核含资产的构建产物契约
        run: pnpm run verify:build
      - name: 启动本地等价网关
        run: |
          node scripts/local-gateway.mjs > /tmp/gateway.log 2>&1 &
          for _ in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:4174/__health >/dev/null; then
              exit 0
            fi
            sleep 0.2
          done
          cat /tmp/gateway.log
          exit 1
      - name: 浏览器启动 Lean 并检查诊断
        env:
          LEAN_E2E_CHANNEL: chrome
        run: node scripts/e2e-lean.mjs
      - name: 逐课运行全部代码块
        env:
          LEAN_E2E_CHANNEL: chrome
          # 工程课会同时加载 Init + Std + Batteries，三路并行把 runner 内存打爆；
          # 单路慢一点，但能稳定跑完 27 节。
          LEAN_E2E_WORKERS: 1
        run: node scripts/e2e-lessons.mjs
      - name: 失败时保留网关日志
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-gateway-log
          path: /tmp/gateway.log
          retention-days: 3
          if-no-files-found: ignore

  audit:
    name: 依赖审计
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 主机参数
        uses: ./.github/actions/host-info
      - uses: pnpm/action-setup@v6
        with:
          version: 12.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 只审生产依赖：开发工具链的告警不阻塞发布，但会在日志里可见。
      - name: 生产依赖高危漏洞
        run: pnpm audit --prod --audit-level high
