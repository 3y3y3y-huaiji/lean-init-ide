name: Probe Lean 4.35 wasm32 recipe

# 只做兼容性探针：把 wasm-llvm 4.34.1 的 Emscripten patch 套到 Lean 4.35.0 源码上，
# 看哪些 hunk 需要 forward-port。真正构建在 probe 通过后再接。
on:
  push:
    branches: [spike/lean-4.35]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: 获取 wasm-llvm 的 4.34.1 patch
        run: |
          git init -q wasm-llvm
          git -C wasm-llvm remote add origin https://github.com/seo-rii/wasm-llvm.git
          git -C wasm-llvm fetch -q --depth 1 origin 14ea5ecbc514b0c87338aebf8f2b567020be5750
          git -C wasm-llvm checkout -q FETCH_HEAD
          sha256sum wasm-llvm/producer/lean-browser/patches/0001-lean-browser-emscripten.patch

      - name: 获取 Lean 4.35.0 源码
        run: |
          git clone --depth 1 --branch v4.35.0 https://github.com/leanprover/lean4.git lean4
          git -C lean4 log -1 --format='%H %s'

      - name: 检查 Emscripten patch
        run: |
          set +e
          cd lean4
          git apply --check ../wasm-llvm/producer/lean-browser/patches/0001-lean-browser-emscripten.patch
          code=$?
          if [ "$code" -eq 0 ]; then
            echo "PATCH_OK Lean 4.35.0 可以直接套用 4.34.1 的 Emscripten patch"
            exit 0
          fi
          echo "PATCH_CONFLICT 需要 forward-port，下面是失败的 hunk："
          git apply --reject ../wasm-llvm/producer/lean-browser/patches/0001-lean-browser-emscripten.patch >/dev/null 2>&1 || true
          find . -name '*.rej' -print -exec sh -c 'echo "----- $1"; cat "$1"' _ {} \;
          exit 1

      - name: 记录 4.35.0 bootstrap 信息
        if: always()
        run: |
          cat <<'EOF'
          bootstrap: https://github.com/leanprover/lean4/releases/download/v4.35.0/lean-4.35.0-linux.tar.zst
          bytes: 594481375
          sha256: 7289597a44543246c9227b8cae501767e095ce17f6d448b95fc4a8dc97268f6d
          commit: eb6cafb7290e8bd5f2937522d8d804f58f02bafc
          EOF
