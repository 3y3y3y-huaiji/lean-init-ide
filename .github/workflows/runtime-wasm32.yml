name: Runtime · Lean 4.34 wasm32 (legacy)
run-name: Runtime 4.34 · legacy build

# 4.34 的 O3 生产构建，保留作历史对照；生产已切到 4.35（runtime-wasm32-435.yml）。
# 只手动触发，避免旧的 spike 分支 push 继续产生运行记录。
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-wasm32
  cancel-in-progress: false

env:
  # 与 config/lean4-runtime.json 的 upstream revision 保持一致，确保 Init olean 可复用。
  WASM_LLVM_REV: 14ea5ecbc514b0c87338aebf8f2b567020be5750
  EMSDK_VERSION: 6.0.0

jobs:
  prepare:
    name: 准备源码与 C 代码
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7

      - name: 安装构建依赖
        run: sudo apt-get update && sudo apt-get install -y cmake zstd

      - name: 缓存 Emscripten 6.0.0
        uses: actions/cache@v6
        with:
          path: emsdk
          key: wasm32-emsdk-6.0.0-v1

      - name: 安装 Emscripten 6.0.0
        run: |
          if [ ! -x emsdk/upstream/emscripten/emcc ]; then
            git clone --depth 1 https://github.com/emscripten-core/emsdk.git
            (cd emsdk && ./emsdk install 6.0.0 && ./emsdk activate 6.0.0)
          fi
          source emsdk/emsdk_env.sh
          emcc --version | head -n 2

      - name: 拉取 wasm-llvm 并只把 O2 改成 O3
        run: |
          git init -q wasm-llvm
          git -C wasm-llvm remote add origin https://github.com/seo-rii/wasm-llvm.git
          git -C wasm-llvm fetch -q --depth 1 origin "$WASM_LLVM_REV"
          git -C wasm-llvm checkout -q FETCH_HEAD
          cd wasm-llvm
          sed -i \
            -e 's|emcc -c -O2|emcc -c -O3|g' \
            -e 's|emcc -O2 -pthread|emcc -O3 -pthread|g' \
            producer/lean-browser/scripts/build.sh
          grep -n -- '-O3\|STACK_SIZE\|PTHREAD_STACK_SIZE' producer/lean-browser/scripts/build.sh

      - name: 缓存 Lean 源码与引导包
        uses: actions/cache@v6
        with:
          path: |
            work/lean4
            work/lean-*-linux
          key: wasm32-src-v1

      - name: fetch
        run: |
          source emsdk/emsdk_env.sh
          cd wasm-llvm
          export EMSDK="$GITHUB_WORKSPACE/emsdk"
          export WASM_LLVM_LEAN_WORK_DIR="$GITHUB_WORKSPACE/work"
          export WASM_LLVM_LEAN_JOBS=3
          bash producer/lean-browser/scripts/build.sh fetch

      - name: 缓存 runtime 产物
        uses: actions/cache@v6
        with:
          path: |
            work/build-wasm
            work/emcache
          key: wasm32-runtime-o3-v1

      - name: runtime
        run: |
          source emsdk/emsdk_env.sh
          cd wasm-llvm
          export EMSDK="$GITHUB_WORKSPACE/emsdk"
          export WASM_LLVM_LEAN_WORK_DIR="$GITHUB_WORKSPACE/work"
          export WASM_LLVM_LEAN_JOBS=3
          bash producer/lean-browser/scripts/build.sh emsdk runtime

      - name: 缓存 cgen
        uses: actions/cache@v6
        with:
          path: work/cgen
          key: wasm32-cgen-v1

      - name: cgen
        run: |
          source emsdk/emsdk_env.sh
          cd wasm-llvm
          export EMSDK="$GITHUB_WORKSPACE/emsdk"
          export WASM_LLVM_LEAN_WORK_DIR="$GITHUB_WORKSPACE/work"
          export WASM_LLVM_LEAN_JOBS=3
          bash producer/lean-browser/scripts/build.sh cgen

  finish:
    name: 编译对象、链接并打包
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7

      - name: 安装构建依赖
        run: sudo apt-get update && sudo apt-get install -y cmake zstd

      - name: 缓存 Emscripten 6.0.0
        uses: actions/cache@v6
        with:
          path: emsdk
          key: wasm32-emsdk-6.0.0-v1

      - name: 安装 Emscripten 6.0.0
        run: |
          if [ ! -x emsdk/upstream/emscripten/emcc ]; then
            git clone --depth 1 https://github.com/emscripten-core/emsdk.git
            (cd emsdk && ./emsdk install 6.0.0 && ./emsdk activate 6.0.0)
          fi
          source emsdk/emsdk_env.sh
          emcc --version | head -n 2

      - name: 拉取 wasm-llvm 并只把 O2 改成 O3
        run: |
          git init -q wasm-llvm
          git -C wasm-llvm remote add origin https://github.com/seo-rii/wasm-llvm.git
          git -C wasm-llvm fetch -q --depth 1 origin "$WASM_LLVM_REV"
          git -C wasm-llvm checkout -q FETCH_HEAD
          cd wasm-llvm
          sed -i \
            -e 's|emcc -c -O2|emcc -c -O3|g' \
            -e 's|emcc -O2 -pthread|emcc -O3 -pthread|g' \
            producer/lean-browser/scripts/build.sh
          grep -n -- '-O3\|STACK_SIZE\|PTHREAD_STACK_SIZE' producer/lean-browser/scripts/build.sh

      - name: 恢复 Lean 源码与引导包
        uses: actions/cache@v6
        with:
          path: |
            work/lean4
            work/lean-*-linux
          key: wasm32-src-v1

      - name: 恢复 runtime 产物
        uses: actions/cache@v6
        with:
          path: |
            work/build-wasm
            work/emcache
          key: wasm32-runtime-o3-v1

      - name: 恢复 cgen
        uses: actions/cache@v6
        with:
          path: work/cgen
          key: wasm32-cgen-v1

      - name: 写入 emsdk 路径
        run: |
          source emsdk/emsdk_env.sh
          cd wasm-llvm
          export EMSDK="$GITHUB_WORKSPACE/emsdk"
          export WASM_LLVM_LEAN_WORK_DIR="$GITHUB_WORKSPACE/work"
          export WASM_LLVM_LEAN_JOBS=3
          bash producer/lean-browser/scripts/build.sh emsdk

      - name: 缓存 objects（O3）
        uses: actions/cache@v6
        with:
          path: work/obj
          key: wasm32-obj-o3-v1

      - name: objects
        id: objects
        run: |
          source emsdk/emsdk_env.sh
          cd wasm-llvm
          export EMSDK="$GITHUB_WORKSPACE/emsdk"
          export WASM_LLVM_LEAN_WORK_DIR="$GITHUB_WORKSPACE/work"
          export WASM_LLVM_LEAN_JOBS=3
          bash producer/lean-browser/scripts/build.sh objects

      # 后续步骤失败时也要保住 objects，避免重编 649 个模块。
      - name: 立即保存 objects 缓存
        if: always() && steps.objects.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: work/obj
          key: wasm32-obj-o3-v1

      - name: link
        run: |
          source emsdk/emsdk_env.sh
          cd wasm-llvm
          export EMSDK="$GITHUB_WORKSPACE/emsdk"
          export WASM_LLVM_LEAN_WORK_DIR="$GITHUB_WORKSPACE/work"
          export WASM_LLVM_LEAN_JOBS=3
          bash producer/lean-browser/scripts/build.sh link

      - name: 准备 Init oleans（复用现有 32 位资产）
        run: |
          BASE="https://raw.githubusercontent.com/seo-rii/wasm-llvm/$WASM_LLVM_REV/artifacts/lean-browser"
          mkdir -p work/init/packs work/init/lib
          curl -fsSL "$BASE/lean-init.index.json" -o work/init/index.json
          for i in 00 01 02 03 04 05; do
            curl -fsSL "$BASE/lean-init-$i.pack.gz" -o "work/init/packs/$i.gz"
          done
          node - <<'JS'
          const fs = require('node:fs');
          const path = require('node:path');
          const zlib = require('node:zlib');
          const index = JSON.parse(fs.readFileSync('work/init/index.json', 'utf8'));
          const stream = Buffer.allocUnsafe(index.totalBytes);
          for (const chunk of index.chunks) {
            const id = chunk.path.match(/lean-init-(\d+)/)[1];
            const raw = zlib.gunzipSync(fs.readFileSync(`work/init/packs/${id}.gz`));
            if (raw.length !== chunk.uncompressedBytes) throw new Error(`chunk size ${id}`);
            raw.copy(stream, chunk.offset);
          }
          for (const file of index.files) {
            const target = path.join('work/init/lib', file.path);
            fs.mkdirSync(path.dirname(target), { recursive: true });
            fs.writeFileSync(target, stream.subarray(file.offset, file.offset + file.bytes));
          }
          console.log(`init files=${index.files.length}`);
          JS

      - name: 冒烟：--version 与 import Init 的最小文件
        run: |
          set -uo pipefail
          ls -lh work/dist
          mkdir -p work/probe work/mini
          set +e
          node wasm-llvm/producer/lean-browser/scripts/run-lean.mjs \
            work/dist/lean.mjs work/probe work/init/lib -- --version 2>&1 | tee work/version.log
          grep -q 'Lean (version 4.34.1' work/version.log || { echo 'version 冒烟失败'; exit 1; }
          printf 'import Init\nexample : 1 + 1 = 2 := rfl\n' > work/mini/Mini.lean
          node wasm-llvm/producer/lean-browser/scripts/run-lean.mjs \
            work/dist/lean.mjs work/mini work/init/lib -- \
            -j1 -R /src -o /src/Mini.olean /src/Mini.lean 2>&1 | tee work/mini.log
          test -s work/mini/Mini.olean || { echo '最小文件没有产出 olean'; exit 1; }
          echo 'runtime 冒烟通过'

      - name: 打包 O3 资产（gzip / zstd / sha256）
        run: |
          cd work/dist
          gzip -9 -c lean.wasm > lean.wasm.gz
          # 用 Node 的 zstd 与 scripts/fetch-assets.mjs 保持同一套压缩参数，
          # 确保构建期重算的 .bin 与这里交付的字节完全一致。
          node - <<'JS'
          const fs = require('node:fs');
          const zlib = require('node:zlib');
          const wasm = fs.readFileSync('lean.wasm');
          const bin = zlib.zstdCompressSync(wasm, {
            params: { [zlib.constants.ZSTD_c_compressionLevel]: 19 },
          });
          fs.writeFileSync('lean.wasm.gz.bin', bin);
          JS
          sha256sum lean.mjs lean.wasm lean.wasm.gz lean.wasm.gz.bin > SHA256SUMS
          node - <<'JS'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const hash = (p) => crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');
          const size = (p) => fs.statSync(p).size;
          const summary = {
            'lean.mjs': { bytes: size('lean.mjs'), sha256: hash('lean.mjs') },
            'lean.wasm.gz.bin': {
              bytes: size('lean.wasm.gz.bin'),
              sha256: hash('lean.wasm.gz.bin'),
              uncompressedBytes: size('lean.wasm'),
              uncompressedSha256: hash('lean.wasm'),
            },
            'lean.wasm.gz': { bytes: size('lean.wasm.gz'), sha256: hash('lean.wasm.gz') },
          };
          fs.writeFileSync('runtime-summary.json', JSON.stringify(summary, null, 2) + '\n');
          JS
          cat runtime-summary.json

      - name: 记录构建参数
        if: always()
        run: |
          {
            echo "wasm-llvm-rev=$WASM_LLVM_REV"
            echo "emsdk=$EMSDK_VERSION"
            echo "optimization=-O3"
            echo "lean-version=$([[ -x work/lean-4.34.1-linux/bin/lean ]] && work/lean-4.34.1-linux/bin/lean --version || echo unknown)"
          } | tee work/build-flags.txt

      - name: 上传运行时产物
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wasm32-runtime-o3
          path: |
            work/dist/lean.mjs
            work/dist/lean.wasm
            work/dist/lean.wasm.gz
            work/dist/lean.wasm.gz.bin
            work/dist/runtime-summary.json
            work/dist/SHA256SUMS
            work/mini/Mini.olean
            work/mini.log
            work/version.log
            work/build-flags.txt
          if-no-files-found: warn
