name: CI · 应用
run-name: CI · ${{ github.ref_name }} · ${{ github.event_name }}

# PR 走本工作流；deploy.yml 在 direct push 时复用本工作流，PR 合并则直接部署。
on:
  pull_request:
  workflow_dispatch:
  # 允许 deploy.yml 在 direct push 时复用同一套检查。
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: 静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 主机参数
        uses: ./.github/actions/host-info
      - uses: pnpm/action-setup@v6
        with:
          version: 12.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: 代码格式
        run: pnpm run format:check
      - name: ESLint
        run: pnpm run lint
      - name: 类型检查（应用 / Service Worker / Pages Functions）
        run: pnpm run typecheck
      - name: 资产清单结构
        run: pnpm run verify:manifest

  actionlint:
    name: Actions 工作流静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # 固定版本，避免 latest 变更导致流水线突然变红。
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7

  test:
    name: 单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 主机参数
        uses: ./.github/actions/host-info
      - uses: pnpm/action-setup@v6
        with:
          version: 12.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      # 覆盖率阈值写在 vitest.config.ts，低于阈值即失败。
      - run: pnpm test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  build:
    name: 构建产物
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 主机参数
        uses: ./.github/actions/host-info
      - uses: pnpm/action-setup@v6
        with:
          version: 12.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      # build:web 跳过 102 MB 资产下载，运行时由 /cdn 网关按需拉取。
      - run: pnpm run build:web
      - name: 产物契约
        run: pnpm run verify:build
      # E2E 直接复用这份 dist，避免再跑一次 vite build，也保证测的是同一份产物。
      # 必须开启 include-hidden-files，否则 dist/.well-known/ai-catalog.json 会被跳过。
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          include-hidden-files: true
          retention-days: 1

  # 浏览器 E2E 拆成三个并行 job：启动冒烟一个、课程按分片并行。
  # 原来串行跑「冒烟 + 27 节课」是整条 PR 流水线的最长路径；
  # 拆开后墙钟时间从「冒烟 + 课程」降到两者的最大值。
  e2e-smoke:
    name: 浏览器端到端（启动与诊断）
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 主机参数
        uses: ./.github/actions/host-info
      - name: 准备 E2E 环境
        uses: ./.github/actions/e2e-prepare
        with:
          # 和 deploy / modelscope 共用基础资产缓存。
          assets-cache-key: lean-assets-${{ hashFiles('config/lean4-runtime.json') }}
      - name: 浏览器启动 Lean 并检查诊断
        env:
          LEAN_E2E_CHANNEL: chrome
        run: node scripts/e2e-lean.mjs
      - name: 失败时保留网关日志
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-smoke-gateway-log
          path: /tmp/gateway.log
          retention-days: 3
          if-no-files-found: ignore

  e2e-lessons:
    name: 浏览器端到端（课程 ${{ matrix.shard }}/2）
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # 分片数要同时改 matrix 长度与下面的 LEAN_E2E_SHARDS。
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - name: 主机参数
        uses: ./.github/actions/host-info
      - name: 准备 E2E 环境
        uses: ./.github/actions/e2e-prepare
        with:
          # 工程实战课直接编译 Std / Batteries，E2E 必须能像生产一样提供扩展分包。
          extensions: '1'
          # 带扩展的资产单独缓存，避免每次从 GitHub / 魔搭重下约 75 MB。
          assets-cache-key: lean-assets-${{ hashFiles('config/lean4-runtime.json') }}-extensions
      - name: 逐课运行全部代码块（分片 ${{ matrix.shard }}/2）
        env:
          LEAN_E2E_CHANNEL: chrome
          # 工程课会同时加载 Init + Std + Batteries，三路并行把 runner 内存打爆；
          # 保持单路，用两个独立 runner 分片并行，稳定且墙钟时间减半。
          LEAN_E2E_WORKERS: 1
          LEAN_E2E_SHARDS: 2
          LEAN_E2E_SHARD: ${{ matrix.shard }}
        run: node scripts/e2e-lessons.mjs
      - name: 失败时保留网关日志
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-lessons-${{ matrix.shard }}-gateway-log
          path: /tmp/gateway.log
          retention-days: 3
          if-no-files-found: ignore

  audit:
    name: 依赖审计
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 主机参数
        uses: ./.github/actions/host-info
      - uses: pnpm/action-setup@v6
        with:
          version: 12.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # pnpm audit 只读锁文件，不需要安装依赖，省掉一次 store 还原与 install。
      # 只审生产依赖：开发工具链的告警不阻塞发布，但会在日志里可见。
      - name: 生产依赖高危漏洞
        run: pnpm audit --prod --audit-level high
