name: Runtime · 魔搭镜像
run-name: ModelScope · ${{ inputs.verify_only && 'verify' || 'upload' }}

on:
  workflow_dispatch:
    inputs:
      verify_only:
        description: 只校验远端 Range/CORS，不重新上传
        type: boolean
        default: false
      prune:
        description: 上传前清理仓库根目录下的旧版本目录（如 14ea5ec/）
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  upload:
    name: 上传运行时资产
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 12.18.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 和 CI 其它 job 共用资产缓存；命中时 fetch:assets 只做哈希校验。
      - name: 缓存 Lean 资产
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: public/wasm-lean4
          key: lean-assets-${{ hashFiles('config/lean4-runtime.json') }}
      - name: 准备 Lean 资产
        run: pnpm run fetch:assets
      - name: 配置 git 身份
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: 上传到 ModelScope
        env:
          MODELSCOPE_USERNAME: HQZMSu
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
          MODELSCOPE_REPO: HQZMSu/lean4-assets
        run: |
          args=""
          if [ "${{ inputs.prune }}" = "true" ]; then args="--prune"; fi
          if [ "${{ inputs.verify_only }}" = "true" ]; then
            pnpm run upload:modelscope -- --verify-only
          else
            pnpm run upload:modelscope -- $args
          fi
