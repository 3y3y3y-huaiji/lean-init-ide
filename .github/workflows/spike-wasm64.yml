name: Spike wasm64

# 仅用于 spike/wasm64 分支：验证 Lean 4 能否以 wasm64（64 位指针）构建，
# 以及能否直接加载官方 64 位 Init oleans。不要合并到 main。
on:
  push:
    branches: [spike/wasm64]
  workflow_dispatch:

permissions:
  contents: read

# 长构建不能被随手一推杀掉；新提交排队等待。
concurrency:
  group: spike-wasm64
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7

      - name: 安装构建依赖
        run: sudo apt-get update && sudo apt-get install -y cmake zstd

      - name: 缓存 Emscripten 6.0.0
        uses: actions/cache@v6
        with:
          path: emsdk
          key: wasm64-emsdk-6.0.0-v1

      - name: 安装 Emscripten 6.0.0
        run: |
          if [ ! -x emsdk/upstream/emscripten/emcc ]; then
            git clone --depth 1 https://github.com/emscripten-core/emsdk.git
            (cd emsdk && ./emsdk install 6.0.0 && ./emsdk activate 6.0.0)
          fi
          source emsdk/emsdk_env.sh
          emcc --version | head -n 2

      - name: 探测 memory64 + pthreads
        run: |
          source emsdk/emsdk_env.sh
          cat > probe.c <<'EOF'
          #include <pthread.h>
          #include <stdio.h>
          static void *worker(void *arg) { *(int *)arg = 42; return NULL; }
          int main(void) {
            printf("sizeof(void*)=%zu\n", sizeof(void *));
            pthread_t t;
            int value = 0;
            if (pthread_create(&t, NULL, worker, &value) != 0) {
              puts("pthread_create failed");
              return 2;
            }
            pthread_join(t, NULL);
            printf("value=%d\n", value);
            return value == 42 ? 0 : 3;
          }
          EOF
          emcc probe.c -sMEMORY64=1 -pthread -O2 -sPTHREAD_POOL_SIZE=2 -sENVIRONMENT=node -o probe.mjs
          node probe.mjs

      - name: 准备 wasm-llvm 并切成 wasm64 + O1
        run: |
          git clone --depth 1 https://github.com/seo-rii/wasm-llvm.git wasm-llvm
          cd wasm-llvm
          sed -i \
            -e 's|-DCMAKE_BUILD_TYPE=Release|-DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS=-sMEMORY64=1 -DCMAKE_CXX_FLAGS=-sMEMORY64=1 -DCMAKE_EXE_LINKER_FLAGS=-sMEMORY64=1|' \
            -e 's|emcc -c -O2|emcc -sMEMORY64=1 -c -O1|g' \
            -e 's|emcc -O2 -pthread|emcc -sMEMORY64=1 -O1 -pthread|g' \
            producer/lean-browser/scripts/build.sh
          grep -n -- 'MEMORY64' producer/lean-browser/scripts/build.sh

      - name: 缓存 Lean 源码与引导包
        uses: actions/cache@v6
        with:
          path: |
            work/lean4
            work/lean-4.34.1-linux
          key: wasm64-src-v1

      - name: fetch
        run: |
          source emsdk/emsdk_env.sh
          cd wasm-llvm
          export EMSDK="$GITHUB_WORKSPACE/emsdk"
          export WASM_LLVM_LEAN_WORK_DIR="$GITHUB_WORKSPACE/work"
          export WASM_LLVM_LEAN_JOBS=3
          # 缓存里的源码可能带着上一次的本地修改；先恢复干净，让 fetch 重新应用 pinned patch。
          if [ -d "$WASM_LLVM_LEAN_WORK_DIR/lean4/.git" ]; then
            git -C "$WASM_LLVM_LEAN_WORK_DIR/lean4" reset --hard -q HEAD
            git -C "$WASM_LLVM_LEAN_WORK_DIR/lean4" clean -fdq
          fi
          bash producer/lean-browser/scripts/build.sh fetch
          # LibUV 的 ExternalProject 只接收 EMSCRIPTEN_SETTINGS 作为 CMAKE_C_FLAGS，
          # 不带上 64 位指针选项会编出 wasm32 的 libuv.a，链接时报 "wasm32 object file can't be linked in wasm64 mode"。
          sed -i 's|set(EMSCRIPTEN_SETTINGS "-s ALLOW_MEMORY_GROWTH=1 -fwasm-exceptions -pthread")|set(EMSCRIPTEN_SETTINGS "-sMEMORY64=1 -s ALLOW_MEMORY_GROWTH=1 -fwasm-exceptions -pthread")|' \
            "$WASM_LLVM_LEAN_WORK_DIR/lean4/src/CMakeLists.txt"
          grep -n 'EMSCRIPTEN_SETTINGS' "$WASM_LLVM_LEAN_WORK_DIR/lean4/src/CMakeLists.txt" | head -n 3

      - name: 缓存 runtime 产物
        uses: actions/cache@v6
        with:
          path: |
            work/build-wasm
            work/emcache
          key: wasm64-runtime-v4

      - name: runtime
        run: |
          source emsdk/emsdk_env.sh
          cd wasm-llvm
          export EMSDK="$GITHUB_WORKSPACE/emsdk"
          export WASM_LLVM_LEAN_WORK_DIR="$GITHUB_WORKSPACE/work"
          export WASM_LLVM_LEAN_JOBS=3
          bash producer/lean-browser/scripts/build.sh emsdk runtime

      - name: 缓存 cgen（机器生成的 C 源码）
        uses: actions/cache@v6
        with:
          path: work/cgen
          key: wasm64-cgen-v1

      - name: cgen
        run: |
          source emsdk/emsdk_env.sh
          cd wasm-llvm
          export EMSDK="$GITHUB_WORKSPACE/emsdk"
          export WASM_LLVM_LEAN_WORK_DIR="$GITHUB_WORKSPACE/work"
          export WASM_LLVM_LEAN_JOBS=3
          bash producer/lean-browser/scripts/build.sh cgen

  finish:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7

      - name: 安装构建依赖
        run: sudo apt-get update && sudo apt-get install -y cmake zstd

      - name: 缓存 Emscripten 6.0.0
        uses: actions/cache@v6
        with:
          path: emsdk
          key: wasm64-emsdk-6.0.0-v1

      - name: 安装 Emscripten 6.0.0
        run: |
          if [ ! -x emsdk/upstream/emscripten/emcc ]; then
            git clone --depth 1 https://github.com/emscripten-core/emsdk.git
            (cd emsdk && ./emsdk install 6.0.0 && ./emsdk activate 6.0.0)
          fi
          source emsdk/emsdk_env.sh
          emcc --version | head -n 2

      - name: 准备 wasm-llvm 并切成 wasm64 + O1
        run: |
          git clone --depth 1 https://github.com/seo-rii/wasm-llvm.git wasm-llvm
          cd wasm-llvm
          sed -i \
            -e 's|-DCMAKE_BUILD_TYPE=Release|-DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS=-sMEMORY64=1 -DCMAKE_CXX_FLAGS=-sMEMORY64=1 -DCMAKE_EXE_LINKER_FLAGS=-sMEMORY64=1|' \
            -e 's|emcc -c -O2|emcc -sMEMORY64=1 -c -O1|g' \
            -e 's|emcc -O2 -pthread|emcc -sMEMORY64=1 -O1 -pthread|g' \
            producer/lean-browser/scripts/build.sh
          grep -n -- 'MEMORY64' producer/lean-browser/scripts/build.sh

      - name: 恢复 Lean 源码与引导包
        uses: actions/cache@v6
        with:
          path: |
            work/lean4
            work/lean-4.34.1-linux
          key: wasm64-src-v1

      - name: 恢复 runtime 产物
        uses: actions/cache@v6
        with:
          path: |
            work/build-wasm
            work/emcache
          key: wasm64-runtime-v4

      - name: 恢复 cgen
        uses: actions/cache@v6
        with:
          path: work/cgen
          key: wasm64-cgen-v1

      - name: 缓存 objects
        uses: actions/cache@v6
        with:
          path: work/obj
          key: wasm64-obj-v3

      - name: 写入 emsdk 路径（后续阶段不再重复检查）
        run: |
          source emsdk/emsdk_env.sh
          cd wasm-llvm
          export EMSDK="$GITHUB_WORKSPACE/emsdk"
          export WASM_LLVM_LEAN_WORK_DIR="$GITHUB_WORKSPACE/work"
          export WASM_LLVM_LEAN_JOBS=3
          bash producer/lean-browser/scripts/build.sh emsdk

      - name: objects
        run: |
          source emsdk/emsdk_env.sh
          cd wasm-llvm
          export EMSDK="$GITHUB_WORKSPACE/emsdk"
          export WASM_LLVM_LEAN_WORK_DIR="$GITHUB_WORKSPACE/work"
          export WASM_LLVM_LEAN_JOBS=3
          bash producer/lean-browser/scripts/build.sh objects

      - name: link
        run: |
          source emsdk/emsdk_env.sh
          cd wasm-llvm
          export EMSDK="$GITHUB_WORKSPACE/emsdk"
          export WASM_LLVM_LEAN_WORK_DIR="$GITHUB_WORKSPACE/work"
          export WASM_LLVM_LEAN_JOBS=3
          bash producer/lean-browser/scripts/build.sh link

      - name: 准备浏览器驱动（pnpm + runner 自带 Chrome，不下载浏览器）
        run: |
          corepack enable
          corepack prepare pnpm@12.18.0 --activate
          mkdir -p work/browser
          cd work/browser
          pnpm init > /dev/null
          pnpm pkg set type=module
          pnpm add playwright-core tsx esbuild --allow-build=esbuild
          cp ../../scripts/wasm64-browser-verify.ts .
          pnpm exec esbuild ../../scripts/wasm64-browser-harness.ts --bundle --format=esm --outfile=../../work/dist/harness.mjs

      - name: 关键验证：runner 自带 Chrome（Memory64 原生支持）里启动 wasm64 Lean
        timeout-minutes: 20
        run: |
          cd work/browser
          pnpm exec tsx wasm64-browser-verify.ts ../../work/dist

      - name: 保存产物与日志
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wasm64-spike
          path: |
            work/dist/**
            work/*.log
            work/*.olean-fail.log
          if-no-files-found: warn
