      content="不是正则模拟，也不是云端跑代码：完整 Lean 4.35.0 编译器与语言服务器就塞在 Web Worker 里。单元测试只能测几个用例，Lean 能把所有输入一次性证死。"
    />
    <link rel="preconnect" href="https://raw.githubusercontent.com" crossorigin />
    <script>
      // 首屏绘制前确定主题，避免闪白或闪黑。
      (() => {
        try {
          const stored = localStorage.getItem('lean:theme');
          const pref =
            stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system';
          const systemLight = window.matchMedia('(prefers-color-scheme: light)').matches;
          const resolved = pref === 'system' ? (systemLight ? 'light' : 'dark') : pref;
          document.documentElement.dataset.theme = resolved;
          document.documentElement.dataset.themePreference = pref;
        } catch {
          // localStorage 不可用时保留默认暗色。
        }
      })();
    </script>
  </head>
  <body data-page="content">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
