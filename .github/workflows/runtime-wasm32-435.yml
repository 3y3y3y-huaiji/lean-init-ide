name: Build wasm32 Lean 4.35 runtime

# 把 wasm-llvm 的 4.34.1 recipe forward-port 到 Lean 4.35.0：
# - 只改 manifest 的 Lean pin / bootstrap / patch 哈希
# - 用 scripts/patches/lean-435-emscripten.patch（删掉上游已吸收的 event_loop hunk）
# - 其余仍是上游默认，只把 emcc O2 改成 O3
# - 重新编译 Init oleans 并打包成 lean-init-*.pack
on:
  push:
    branches: [spike/lean-4.35]
    tags: ['runtime-v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 构建完成后发布到
        type: choice
        options:
          - none
          - r2
          - modelscope
          - both
        default: none
      verify_only:
        description: 只校验远端对象，不写入
        type: boolean
        default: false
      build_extensions:
        description: 同时编译 Std + Batteries 扩展 pack
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: runtime-wasm32-435
  cancel-in-progress: false

env:
  WASM_LLVM_REV: 14ea5ecbc514b0c87338aebf8f2b567020be5750
  EMSDK_VERSION: 6.0.0
  LEAN_VERSION: 4.35.0
  LEAN_TAG: v4.35.0
  LEAN_COMMIT: eb6cafb7290e8bd5f2937522d8d804f58f02bafc
  BOOTSTRAP_URL: https://github.com/leanprover/lean4/releases/download/v4.35.0/lean-4.35.0-linux.tar.zst
  BOOTSTRAP_BYTES: 594481375
  BOOTSTRAP_SHA256: 7289597a44543246c9227b8cae501767e095ce17f6d448b95fc4a8dc97268f6d
  BATTERIES_TAG: v4.35.0
  BATTERIES_COMMIT: 66e469188fe07963e5cf666c7d4433f45b8131c5

jobs:
  prepare:
    name: 准备 4.35 源码与 C 代码
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7

      - name: 安装构建依赖
        run: sudo apt-get update && sudo apt-get install -y cmake zstd

      - name: 缓存 Emscripten 6.0.0
        uses: actions/cache@v6
        with:
          path: emsdk
          key: wasm32-emsdk-6.0.0-v1

      - name: 安装 Emscripten 6.0.0
        run: |
          if [ ! -x emsdk/upstream/emscripten/emcc ]; then
            git clone --depth 1 https://github.com/emscripten-core/emsdk.git
            (cd emsdk && ./emsdk install 6.0.0 && ./emsdk activate 6.0.0)
          fi
          source emsdk/emsdk_env.sh
          emcc --version | head -n 2

      - name: 拉取 wasm-llvm 并 forward-port 到 4.35.0
        run: |
          git init -q wasm-llvm
          git -C wasm-llvm remote add origin https://github.com/seo-rii/wasm-llvm.git
          git -C wasm-llvm fetch -q --depth 1 origin "$WASM_LLVM_REV"
          git -C wasm-llvm checkout -q FETCH_HEAD
          cp "$GITHUB_WORKSPACE/scripts/patches/lean-435-emscripten.patch" \
            wasm-llvm/producer/lean-browser/patches/0001-lean-browser-emscripten.patch
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib

          root = pathlib.Path(os.environ["GITHUB_WORKSPACE"]) / "wasm-llvm/producer/lean-browser"
          patch = (root / "patches/0001-lean-browser-emscripten.patch").read_bytes()
          manifest_path = root / "manifest.json"
          manifest = json.loads(manifest_path.read_text())
          manifest["sources"]["lean4"]["version"] = os.environ["LEAN_VERSION"]
          manifest["sources"]["lean4"]["tag"] = os.environ["LEAN_TAG"]
          manifest["sources"]["lean4"]["commit"] = os.environ["LEAN_COMMIT"]
          manifest["bootstrap"] = {
              "description": "official native Lean release used to emit C for Init, Std, and Lean and to compute Init module dependencies",
              "url": os.environ["BOOTSTRAP_URL"],
              "bytes": int(os.environ["BOOTSTRAP_BYTES"]),
              "sha256": os.environ["BOOTSTRAP_SHA256"],
          }
          manifest["patches"][0]["sha256"] = hashlib.sha256(patch).hexdigest()
          manifest_path.write_text(json.dumps(manifest, indent="\t") + "\n")
          print("lean", manifest["sources"]["lean4"]["version"], manifest["sources"]["lean4"]["commit"])
          print("bootstrap", manifest["bootstrap"]["bytes"], manifest["bootstrap"]["sha256"])
          print("patch", manifest["patches"][0]["sha256"])
          PY
          cd wasm-llvm
          sed -i \
            -e 's|emcc -c -O2|emcc -c -O3|g' \
            -e 's|emcc -O2 -pthread|emcc -O3 -pthread|g' \
            producer/lean-browser/scripts/build.sh
          grep -n -- '-O3\|STACK_SIZE\|PTHREAD_STACK_SIZE' producer/lean-browser/scripts/build.sh

      - name: 缓存 4.35 源码与引导包
        uses: actions/cache@v6
        with:
          path: |
            work/lean4
            work/lean-*-linux
          key: wasm435-src-v1

      - name: fetch 4.35
        run: |
          source emsdk/emsdk_env.sh
          cd wasm-llvm
          export EMSDK="$GITHUB_WORKSPACE/emsdk"
          export WASM_LLVM_LEAN_WORK_DIR="$GITHUB_WORKSPACE/work"
          export WASM_LLVM_LEAN_JOBS=3
          # 缓存里的源码可能带着上一次已应用的 patch；先恢复干净，让 fetch 重新应用。
          if [ -d "$WASM_LLVM_LEAN_WORK_DIR/lean4/.git" ]; then
            git -C "$WASM_LLVM_LEAN_WORK_DIR/lean4" reset --hard -q HEAD
            git -C "$WASM_LLVM_LEAN_WORK_DIR/lean4" clean -fdq
          fi
          bash producer/lean-browser/scripts/build.sh fetch

      - name: 缓存 runtime 产物
        uses: actions/cache@v6
        with:
          path: |
            work/build-wasm
            work/emcache
          key: wasm435-runtime-v1

      - name: runtime
        run: |
          source emsdk/emsdk_env.sh
          cd wasm-llvm
          export EMSDK="$GITHUB_WORKSPACE/emsdk"
          export WASM_LLVM_LEAN_WORK_DIR="$GITHUB_WORKSPACE/work"
          export WASM_LLVM_LEAN_JOBS=3
          bash producer/lean-browser/scripts/build.sh emsdk runtime

      - name: 缓存 cgen
        uses: actions/cache@v6
        with:
          path: work/cgen
          key: wasm435-cgen-v1

      - name: cgen
        run: |
          source emsdk/emsdk_env.sh
          cd wasm-llvm
          export EMSDK="$GITHUB_WORKSPACE/emsdk"
          export WASM_LLVM_LEAN_WORK_DIR="$GITHUB_WORKSPACE/work"
          export WASM_LLVM_LEAN_JOBS=3
          bash producer/lean-browser/scripts/build.sh cgen

  finish:
    name: 编译 4.35 objects、oleans 并打包
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: 安装构建依赖
        run: sudo apt-get update && sudo apt-get install -y cmake zstd

      - name: 缓存 Emscripten 6.0.0
        uses: actions/cache@v6
        with:
          path: emsdk
          key: wasm32-emsdk-6.0.0-v1

      - name: 安装 Emscripten 6.0.0
        run: |
          if [ ! -x emsdk/upstream/emscripten/emcc ]; then
            git clone --depth 1 https://github.com/emscripten-core/emsdk.git
            (cd emsdk && ./emsdk install 6.0.0 && ./emsdk activate 6.0.0)
          fi
          source emsdk/emsdk_env.sh
          emcc --version | head -n 2

      - name: 拉取 wasm-llvm 并 forward-port 到 4.35.0
        run: |
          git init -q wasm-llvm
          git -C wasm-llvm remote add origin https://github.com/seo-rii/wasm-llvm.git
          git -C wasm-llvm fetch -q --depth 1 origin "$WASM_LLVM_REV"
          git -C wasm-llvm checkout -q FETCH_HEAD
          cp "$GITHUB_WORKSPACE/scripts/patches/lean-435-emscripten.patch" \
            wasm-llvm/producer/lean-browser/patches/0001-lean-browser-emscripten.patch
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib

          root = pathlib.Path(os.environ["GITHUB_WORKSPACE"]) / "wasm-llvm/producer/lean-browser"
          patch = (root / "patches/0001-lean-browser-emscripten.patch").read_bytes()
          manifest_path = root / "manifest.json"
          manifest = json.loads(manifest_path.read_text())
          manifest["sources"]["lean4"]["version"] = os.environ["LEAN_VERSION"]
          manifest["sources"]["lean4"]["tag"] = os.environ["LEAN_TAG"]
          manifest["sources"]["lean4"]["commit"] = os.environ["LEAN_COMMIT"]
          manifest["bootstrap"] = {
              "description": "official native Lean release used to emit C for Init, Std, and Lean and to compute Init module dependencies",
              "url": os.environ["BOOTSTRAP_URL"],
              "bytes": int(os.environ["BOOTSTRAP_BYTES"]),
              "sha256": os.environ["BOOTSTRAP_SHA256"],
          }
          manifest["patches"][0]["sha256"] = hashlib.sha256(patch).hexdigest()
          manifest_path.write_text(json.dumps(manifest, indent="\t") + "\n")
          PY
          cd wasm-llvm
          sed -i \
            -e 's|emcc -c -O2|emcc -c -O3|g' \
            -e 's|emcc -O2 -pthread|emcc -O3 -pthread|g' \
            producer/lean-browser/scripts/build.sh
          grep -n -- '-O3\|STACK_SIZE\|PTHREAD_STACK_SIZE' producer/lean-browser/scripts/build.sh

      - name: 恢复 4.35 源码与引导包
        uses: actions/cache@v6
        with:
          path: |
            work/lean4
            work/lean-*-linux
          key: wasm435-src-v1

      - name: 恢复 runtime 产物
        uses: actions/cache@v6
        with:
          path: |
            work/build-wasm
            work/emcache
          key: wasm435-runtime-v1

      - name: 恢复 cgen
        uses: actions/cache@v6
        with:
          path: work/cgen
          key: wasm435-cgen-v1

      - name: 写入 emsdk 路径
        run: |
          source emsdk/emsdk_env.sh
          cd wasm-llvm
          export EMSDK="$GITHUB_WORKSPACE/emsdk"
          export WASM_LLVM_LEAN_WORK_DIR="$GITHUB_WORKSPACE/work"
          export WASM_LLVM_LEAN_JOBS=3
          bash producer/lean-browser/scripts/build.sh emsdk

      - name: 缓存 objects
        uses: actions/cache@v6
        with:
          path: work/obj
          key: wasm435-obj-o3-v1

      - name: objects
        id: objects
        run: |
          source emsdk/emsdk_env.sh
          cd wasm-llvm
          export EMSDK="$GITHUB_WORKSPACE/emsdk"
          export WASM_LLVM_LEAN_WORK_DIR="$GITHUB_WORKSPACE/work"
          export WASM_LLVM_LEAN_JOBS=3
          bash producer/lean-browser/scripts/build.sh objects

      - name: 立即保存 objects 缓存
        if: always() && steps.objects.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: work/obj
          key: wasm435-obj-o3-v1

      - name: link
        run: |
          source emsdk/emsdk_env.sh
          cd wasm-llvm
          export EMSDK="$GITHUB_WORKSPACE/emsdk"
          export WASM_LLVM_LEAN_WORK_DIR="$GITHUB_WORKSPACE/work"
          export WASM_LLVM_LEAN_JOBS=3
          bash producer/lean-browser/scripts/build.sh link

      - name: 准备 modules.txt
        run: |
          BOOT="$(find "$GITHUB_WORKSPACE/work" -maxdepth 1 -type d -name 'lean-*-linux' -print -quit)"
          [ -n "$BOOT" ] || { echo '找不到 lean-*-linux 引导目录'; exit 1; }
          (cd "$BOOT/lib/lean" && find Init Std Lean -name '*.olean' | sed 's/\.olean$//'; printf '%s\n' Init Std Lean) \
            | LC_ALL=C sort > "$GITHUB_WORKSPACE/work/modules.txt"
          wc -l "$GITHUB_WORKSPACE/work/modules.txt"

      - name: 缓存 4.35 Init oleans
        uses: actions/cache@v6
        with:
          path: work/olean32
          key: wasm435-olean32-v1

      - name: 重新编译 4.35 Init oleans
        timeout-minutes: 300
        run: |
          source emsdk/emsdk_env.sh
          cd wasm-llvm
          export EMSDK="$GITHUB_WORKSPACE/emsdk"
          export WASM_LLVM_LEAN_WORK_DIR="$GITHUB_WORKSPACE/work"
          export WASM_LLVM_LEAN_JOBS=3
          bash producer/lean-browser/scripts/build.sh oleans
          find "$GITHUB_WORKSPACE/work/olean32" -name '*.olean' | wc -l

      - name: 冒烟：用 4.35 运行时编译 import Init
        run: |
          set -uo pipefail
          mkdir -p work/mini
          printf 'import Init\nexample : 1 + 1 = 2 := rfl\n' > work/mini/Mini.lean
          node wasm-llvm/producer/lean-browser/scripts/run-lean.mjs \
            work/dist/lean.mjs work/mini work/olean32 -- \
            -j1 -R /src -o /src/Mini.olean /src/Mini.lean 2>&1 | tee work/mini.log
          test -s work/mini/Mini.olean || { echo '最小文件没有产出 olean'; exit 1; }
          echo '4.35 runtime + Init oleans 冒烟通过'

      - name: 打包 4.35 发布资产（zstd + 清单）
        run: |
          node wasm-llvm/producer/lean-browser/scripts/package.mjs --work work --out work/artifact
          node scripts/package-runtime-assets.mjs \
            --artifact work/artifact \
            --lean-version "$LEAN_VERSION" \
            --revision "$WASM_LLVM_REV" \
            --key-prefix "wasm-lean4/$LEAN_VERSION" \
            --mirror-prefix "wasm-lean4/$LEAN_VERSION" \
            --fallback-base "https://github.com/${GITHUB_REPOSITORY}/releases/download/runtime-v${LEAN_VERSION}/" \
            --manifest-out work/artifact/runtime-manifest.json
          ls -lh work/artifact

      - name: 缓存 4.35 Std 扩展 oleans
        if: github.event_name == 'workflow_dispatch' && inputs.build_extensions
        uses: actions/cache@v6
        with:
          path: work/std-olean32
          key: wasm435-std-olean32-v1

      - name: 编译 4.35 Std 扩展 oleans
        if: github.event_name == 'workflow_dispatch' && inputs.build_extensions
        timeout-minutes: 300
        run: |
          BOOT="$(find "$GITHUB_WORKSPACE/work" -maxdepth 1 -type d -name 'lean-*-linux' -print -quit)"
          [ -n "$BOOT" ] || { echo '找不到 lean-*-linux 引导目录'; exit 1; }
          mkdir -p "$GITHUB_WORKSPACE/work/std-olean32"
          cp -a "$GITHUB_WORKSPACE/work/olean32/Init" "$GITHUB_WORKSPACE/work/std-olean32/"
          (
            cd "$GITHUB_WORKSPACE/work/lean4/src"
            (cd "$BOOT/lib/lean" && find Init Std -name '*.olean' | sed 's/\.olean$//'; printf 'Init\nStd\n') \
              | LC_ALL=C sort > "$GITHUB_WORKSPACE/work/std-modules.txt"
            : > "$GITHUB_WORKSPACE/work/deps.txt"
            while read -r module; do
              deps="$(LEAN_PATH="$BOOT/lib/lean" "$BOOT/bin/lean" --deps "$module.lean" | sed "s#^$BOOT/lib/lean/##; s#\.olean\$##" | tr '\n' ' ')"
              printf '%s: %s\n' "$module" "$deps" >> "$GITHUB_WORKSPACE/work/deps.txt"
            done < "$GITHUB_WORKSPACE/work/std-modules.txt"
          )
          node wasm-llvm/producer/lean-browser/scripts/build-oleans.mjs \
            "$GITHUB_WORKSPACE/work/dist/lean.mjs" \
            "$GITHUB_WORKSPACE/work" \
            "$GITHUB_WORKSPACE/work/lean4/src" \
            "$GITHUB_WORKSPACE/work/std-olean32" \
            3 Init Std
          find "$GITHUB_WORKSPACE/work/std-olean32/Std" -name '*.olean' | wc -l

      - name: 冒烟：wasm 运行时 import Std
        if: github.event_name == 'workflow_dispatch' && inputs.build_extensions
        run: |
          mkdir -p work/std-src
          printf 'import Std\nexample : 1 + 1 = 2 := rfl\n' > work/std-src/Test.lean
          node wasm-llvm/producer/lean-browser/scripts/run-lean.mjs \
            work/dist/lean.mjs work/std-src work/std-olean32 -- \
            -j1 -R /src -o /src/Test.olean /src/Test.lean
          test -s work/std-src/Test.olean

      - name: 打包 Std 扩展 pack
        if: github.event_name == 'workflow_dispatch' && inputs.build_extensions
        run: |
          node scripts/package-runtime-extension.mjs \
            --oleans work/std-olean32 --prefix Std --name lean-std --out work/extensions/std
          ls -lh work/extensions/std

      - name: 上传 Std 扩展 pack
        if: github.event_name == 'workflow_dispatch' && inputs.build_extensions
        uses: actions/upload-artifact@v7
        with:
          name: wasm32-std-pack
          path: work/extensions/std/**
          if-no-files-found: warn

      - name: 缓存 Batteries 源码
        if: github.event_name == 'workflow_dispatch' && inputs.build_extensions
        uses: actions/cache@v6
        with:
          path: work/batteries
          key: batteries-v4.35.0

      - name: 拉取 Batteries 4.35.0
        if: github.event_name == 'workflow_dispatch' && inputs.build_extensions
        run: |
          if [ ! -d work/batteries/.git ]; then
            rm -rf work/batteries
            git clone --depth 1 --branch "$BATTERIES_TAG" https://github.com/leanprover-community/batteries.git work/batteries
          fi
          actual="$(git -C work/batteries rev-parse HEAD)"
          test "$actual" = "$BATTERIES_COMMIT" || { echo "Batteries commit $actual != $BATTERIES_COMMIT"; exit 1; }

      - name: 缓存 Batteries oleans
        if: github.event_name == 'workflow_dispatch' && inputs.build_extensions
        uses: actions/cache@v6
        with:
          path: work/batteries-olean32
          key: wasm435-batteries-olean32-v1

      - name: 准备 Batteries 无 Lean 子集
        if: github.event_name == 'workflow_dispatch' && inputs.build_extensions
        run: |
          BOOT="$(find "$GITHUB_WORKSPACE/work" -maxdepth 1 -type d -name 'lean-*-linux' -print -quit)"
          [ -n "$BOOT" ] || { echo '找不到 lean-*-linux 引导目录'; exit 1; }
          # 整目录复制：除了 Init/ Std/ 子目录，根级 Init.olean/Std.olean 和 .ir
          # 也要带上，build-oleans 才会把它们当作已构建，只编译 Batteries。
          # 不删目录，避免把缓存里已有的 Batteries oleans 清掉。
          mkdir -p work/batteries-olean32
          cp -a work/std-olean32/. work/batteries-olean32/
          node scripts/prepare-batteries-extension.mjs \
            --batteries work/batteries --bootstrap "$BOOT" \
            --work work --out-src work/batteries-filtered --out-deps work/deps.txt

      - name: 编译 Batteries 子集 oleans
        if: github.event_name == 'workflow_dispatch' && inputs.build_extensions
        timeout-minutes: 300
        run: |
          set +e
          node wasm-llvm/producer/lean-browser/scripts/build-oleans.mjs \
            "$GITHUB_WORKSPACE/work/dist/lean.mjs" \
            "$GITHUB_WORKSPACE/work" \
            "$GITHUB_WORKSPACE/work/batteries-filtered" \
            "$GITHUB_WORKSPACE/work/batteries-olean32" \
            3 Init Std Batteries
          status=$?
          if [ "$status" -ne 0 ]; then
            echo '--- 诊断：生成的 Batteries.lean 前 20 行 ---'
            head -n 20 work/batteries-filtered/Batteries.lean
            echo '--- 诊断：根文件 import 统计 ---'
            echo "imports=$(grep -c '^import ' work/batteries-filtered/Batteries.lean)"
            grep -n '^import Batteries$' work/batteries-filtered/Batteries.lean || echo '根文件没有自引用 import Batteries'
            echo '--- 诊断：deps.txt 的 Batteries 行 ---'
            grep '^Batteries:' work/deps.txt | cut -c1-400
            echo '--- 诊断：outDir 根级文件 ---'
            ls -l work/batteries-olean32 | head -n 15
            echo '--- 诊断：子集中是否有模块 import Batteries ---'
            grep -rn '^import Batteries$' work/batteries-filtered --include='*.lean' | head -n 5 || true
            echo '--- 诊断：失败日志 ---'
            head -n 40 work/Batteries.olean-fail.log 2>/dev/null || true
          else
            find "$GITHUB_WORKSPACE/work/batteries-olean32/Batteries" -name '*.olean' | wc -l
          fi
          exit "$status"

      - name: 保存 Batteries oleans（失败也保留进度）
        if: always() && github.event_name == 'workflow_dispatch' && inputs.build_extensions
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: work/batteries-olean32
          key: wasm435-batteries-olean32-v1

      - name: 冒烟：wasm 运行时 import Batteries
        if: github.event_name == 'workflow_dispatch' && inputs.build_extensions
        run: |
          mkdir -p work/batteries-src
          printf 'import Batteries\nexample : 1 + 1 = 2 := rfl\n' > work/batteries-src/Test.lean
          node wasm-llvm/producer/lean-browser/scripts/run-lean.mjs \
            work/dist/lean.mjs work/batteries-src work/batteries-olean32 -- \
            -j1 -R /src -o /src/Test.olean /src/Test.lean
          test -s work/batteries-src/Test.olean

      - name: 打包 Batteries 扩展 pack
        if: github.event_name == 'workflow_dispatch' && inputs.build_extensions
        run: |
          node scripts/package-runtime-extension.mjs \
            --oleans work/batteries-olean32 --prefix Batteries --name lean-batteries --out work/extensions/batteries
          ls -lh work/extensions/batteries

      - name: 上传 Batteries 扩展 pack
        if: github.event_name == 'workflow_dispatch' && inputs.build_extensions
        uses: actions/upload-artifact@v7
        with:
          name: wasm32-batteries-pack
          path: work/extensions/batteries/**
          if-no-files-found: warn

      - name: 记录构建参数
        if: always()
        run: |
          {
            echo "lean=$LEAN_VERSION"
            echo "lean-commit=$LEAN_COMMIT"
            echo "wasm-llvm-rev=$WASM_LLVM_REV"
            echo "emsdk=$EMSDK_VERSION"
            echo "optimization=-O3"
          } | tee work/build-flags.txt

      - name: 上传 4.35 运行时与 Init 资产
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wasm32-runtime-4.35.0
          path: |
            work/artifact/**
            work/mini/Mini.olean
            work/mini.log
            work/build-flags.txt
          if-no-files-found: warn

  publish:
    name: 发布 4.35 运行时资产
    needs: finish
    if: (github.event_name == 'workflow_dispatch' && inputs.publish != 'none') || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/runtime-v'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      PUBLISH_TARGET: ${{ github.event_name == 'push' && 'both' || inputs.publish }}
      VERIFY_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_only || 'false' }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.18.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # 缺少 secret 时尽早失败，不浪费下载产物和创建 Release 的时间。
      - name: 检查发布凭据
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
        run: |
          set -eu
          if [ "$PUBLISH_TARGET" = "r2" ] || [ "$PUBLISH_TARGET" = "both" ]; then
            for name in R2_ENDPOINT R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY; do
              value="${!name}"
              [ -n "$value" ] || { echo "缺少 $name"; exit 1; }
            done
          fi
          if [ "$PUBLISH_TARGET" = "modelscope" ] || [ "$PUBLISH_TARGET" = "both" ]; then
            [ -n "$MODELSCOPE_TOKEN" ] || { echo "缺少 MODELSCOPE_TOKEN"; exit 1; }
          fi

      # 产物里的路径是 work/artifact/**，所以解压到 work 才能还原原目录。
      - uses: actions/download-artifact@v8
        with:
          name: wasm32-runtime-4.35.0
          path: work

      - name: 准备上传目录与候选清单
        run: |
          mkdir -p public/wasm-lean4
          cp work/artifact/lean.mjs public/wasm-lean4/
          cp work/artifact/producer-receipt.json public/wasm-lean4/
          cp work/artifact/lean-init.index.json public/wasm-lean4/
          cp work/artifact/*.gz.bin public/wasm-lean4/
          cp scripts/assets/runner-worker.js public/wasm-lean4/
          cp work/artifact/runtime-manifest.json config/lean4-runtime.json
          node -e "const m=require('./config/lean4-runtime.json'); console.log('manifest:', m.runtime, m.cacheKey, m.assets.length, 'assets')"

      # 先保存候选清单：即使后面 R2 / 魔搭发布失败，也能拿到清单排查或重试。
      - name: 保存候选清单
        uses: actions/upload-artifact@v7
        with:
          name: runtime-manifest-4.35.0
          path: |
            work/artifact/runtime-manifest.json
            work/artifact/SHA256SUMS

      - name: 发布 GitHub Release（回退源）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="runtime-v${LEAN_VERSION}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "Lean ${LEAN_VERSION} wasm32 runtime" \
              --notes "wasm32 runtime + Init oleans, packaged by GitHub Actions."
          fi
          gh release upload "$TAG" \
            work/artifact/lean.mjs \
            work/artifact/producer-receipt.json \
            work/artifact/lean-init.index.json \
            work/artifact/*.gz \
            work/artifact/*.gz.bin \
            work/artifact/runtime-manifest.json \
            work/artifact/SHA256SUMS \
            --clobber
          gh release upload "$TAG" scripts/assets/runner-worker.js --clobber

      - name: 上传 R2
        if: env.PUBLISH_TARGET == 'r2' || env.PUBLISH_TARGET == 'both'
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
        run: |
          if [ -z "$R2_ENDPOINT" ] || [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "缺少 R2_ENDPOINT / R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY secrets"
            exit 1
          fi
          command -v aws >/dev/null || (sudo apt-get update && sudo apt-get install -y awscli)
          if [ "$VERIFY_ONLY" = "true" ]; then
            pnpm run upload:assets -- --s3 --verify-only
          else
            pnpm run upload:assets -- --s3
          fi

      - name: 上传 ModelScope
        if: env.PUBLISH_TARGET == 'modelscope' || env.PUBLISH_TARGET == 'both'
        env:
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
          MODELSCOPE_REPO: HQZMSu/lean4-assets
          MODELSCOPE_REPO_TYPE: dataset
        run: |
          if [ -z "$MODELSCOPE_TOKEN" ]; then
            echo "缺少 MODELSCOPE_TOKEN secret"
            exit 1
          fi
          command -v git-lfs >/dev/null || (sudo apt-get update && sudo apt-get install -y git-lfs)
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pnpm run upload:modelscope

      - name: 发布摘要
        run: |
          node -e "const m=require('./config/lean4-runtime.json'); console.log('runtime:', m.runtime); console.log('cacheKey:', m.cacheKey); console.log('primary:', m.primary.baseUrl); console.log('fallback:', m.fallback.baseUrl); console.log('mirror:', m.mirror.baseUrl + m.mirror.prefix); for (const a of m.assets) console.log(' ', a.key, a.bytes, a.sha256.slice(0, 12));"
