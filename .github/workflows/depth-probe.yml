name: Depth probe

# 递归深度探针：用十几行 C++ demo 测浏览器 wasm 递归上界，
# 并复核 Lean WHNF 热点环里有没有尾调用。结论见 docs/WASM64-SPIKE.md。
#
# 重型工具链（emsdk、Lean 官方发行包、浏览器探针）一律在 runner 上跑：
# 本地只做静态检查，不下载工具链、不编译 wasm、不起浏览器。
on:
  push:
    branches: [main]
    # 文档与规范改动用不着重新下载 emsdk、跑浏览器探针。
    # 只监听探针真正消费的 WHNF 补丁；kernel/runtime 补丁不会改变探针产物。
    paths:
      - 'scripts/depth-probe/**'
      - 'scripts/patches/lean-whnf-stack.patch'
      - 'scripts/lib/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig.spike.json'
      - '.github/workflows/depth-probe.yml'
  workflow_dispatch:
    inputs:
      variants:
        description: 逗号分隔的探针变体（留空用 run.ts 的默认值）
        required: false
        default: ''
      js_flags:
        description: 追加给 Chrome 的 V8 flags，例如 --wasm-stack-switching-stack-size=64
        required: false
        default: ''
      whnf_audit:
        description: 下载 scripts/pin-lean.ts 指定的 Lean 发行包并复核 WHNF 热点环的尾调用
        type: boolean
        required: false
        default: false
      whnf_stack:
        description: 应用显式工作栈补丁，编译并审计 WHNF 的递归环
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: depth-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 便宜的门禁先跑：类型、lint、格式、workflow 语法。
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.18.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: TypeScript 静态检查
        run: pnpm run typecheck:spike

      - name: ESLint
        run: pnpm run lint:spike

      - name: Prettier
        run: pnpm run format:check:spike

      - name: GitHub Actions 语法检查
        run: |
          bash <(curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color -shellcheck=

  probe:
    needs: lint
    # 带 [whnf-audit] / [whnf-stack] 的提交只跑审计，避免把同一轮探针再跑一遍。
    if: >-
      github.event_name != 'push' ||
      (!contains(github.event.head_commit.message, '[whnf-audit]') &&
       !contains(github.event.head_commit.message, '[whnf-stack]'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.18.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # wat2wasm 用来汇编 jspi-suspend.wat；wasm-dis 由 emsdk 提供，用来数 return_call。
      - name: 安装 wabt
        run: sudo apt-get update && sudo apt-get install -y wabt

      - name: 缓存 Emscripten 6.0.0
        uses: actions/cache@v6
        with:
          path: emsdk
          key: depth-probe-emsdk-6.0.0-v1

      - name: 安装 Emscripten 6.0.0
        run: |
          if [ ! -x emsdk/upstream/emscripten/emcc ]; then
            git clone --depth 1 https://github.com/emscripten-core/emsdk.git
            (cd emsdk && ./emsdk install 6.0.0 && ./emsdk activate 6.0.0)
          fi
          source emsdk/emsdk_env.sh
          emcc --version | head -n 2
          wat2wasm --version

      - name: 构建探针
        env:
          EMSDK: ${{ github.workspace }}/emsdk
        run: bash scripts/depth-probe/build.sh work/depth-probe

      # runner 自带 Google Chrome；run.ts 默认走 channel=chrome，不额外下载浏览器。
      - name: 运行浏览器探针
        env:
          VARIANTS: ${{ inputs.variants }}
          JS_FLAGS: ${{ inputs.js_flags }}
        run: |
          args=(--out work/depth-probe)
          if [ -n "${VARIANTS:-}" ]; then args+=(--variants "$VARIANTS"); fi
          if [ -n "${JS_FLAGS:-}" ]; then args+=(--js-flags "$JS_FLAGS"); fi
          node scripts/depth-probe/run.ts "${args[@]}" | tee work/depth-probe/browser-results.txt

      # JSPI 已决议 Promise 会走 V8 快路径，pending=0 的那一行不能支持任何结论。
      - name: 校验结果
        run: |
          node --input-type=module - <<'NODE'
          import { readFileSync } from 'node:fs';

          const report = JSON.parse(readFileSync('work/depth-probe/browser-results.json', 'utf8'));
          const requested = report.variants.split(',').filter(Boolean);
          const byName = new Map(report.results.map((row) => [row.name, row]));
          const missing = requested.filter((name) => !byName.has(name));
          if (missing.length > 0) throw new Error(`缺少变体结果: ${missing.join(', ')}`);

          const baseline = byName.get('baseline');
          if (baseline && !(baseline.maxDepth > 0)) throw new Error('baseline 没有测到深度');

          for (const name of requested) {
            if (!name.includes('pending')) continue;
            const row = byName.get(name);
            if (row?.stats && row.stats.pending === 0) {
              throw new Error(`${name} 的 suspend.pending=0，这一行测量无效`);
            }
          }

          console.log(`Chrome: ${report.features?.userAgent ?? 'unknown'}`);
          for (const row of report.results) {
            const depth = row.capped ? `>=${row.maxDepth}` : String(row.maxDepth);
            const stats = row.stats ? ` suspend=${row.stats.pending}/${row.stats.calls}` : '';
            console.log(`${row.name}: ${depth}${stats}`);
          }
          NODE

      - name: 保存探针结果
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: depth-probe
          path: |
            work/depth-probe/browser-results.json
            work/depth-probe/build-summary.json
            work/depth-probe/summary.tsv
            work/depth-probe/browser-results.txt
            work/depth-probe/*.log
          retention-days: 14
          if-no-files-found: warn

  # 重型下载（约 600 MB）只在手动触发时跑，避免每次 push 都占一轮 runner。
  # 本地 token 没有 actions:write 时 `gh workflow run` 会被 403，因此也认提交信息里的
  # [whnf-audit] 标记：推一个带该标记的提交即可触发，不用去网页点按钮。
  whnf-audit:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.whnf_audit) ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[whnf-audit]'))
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: 安装 zstd 与 wabt
        run: sudo apt-get update && sudo apt-get install -y zstd wabt

      - name: 缓存 Emscripten 6.0.0
        uses: actions/cache@v6
        with:
          path: emsdk
          key: depth-probe-emsdk-6.0.0-v1

      - name: 安装 Emscripten 6.0.0
        run: |
          if [ ! -x emsdk/upstream/emscripten/emcc ]; then
            git clone --depth 1 https://github.com/emscripten-core/emsdk.git
            (cd emsdk && ./emsdk install 6.0.0 && ./emsdk activate 6.0.0)
          fi
          source emsdk/emsdk_env.sh
          emcc --version | head -n 2

      # 版本统一从 scripts/pin-lean.ts 读取，升级时不改这里。
      - name: 解析 Lean pin
        id: lean
        run: |
          # shellcheck disable=SC2016 # 单引号里是 JS 模板字符串，由 node 自己展开。
          node -e 'import("./scripts/pin-lean.ts").then((m) => {
            const p = m.resolveLeanPin();
            console.log(`version=${p.version}`);
            console.log(`bootstrap=${p.bootstrapUrl}`);
          })' >> "$GITHUB_OUTPUT"

      # 官方 Linux 发行包自带 olean，`lean -c` 不需要全量编译。
      - name: 下载 Lean ${{ steps.lean.outputs.version }}（发行包 + 源码）
        env:
          VERSION: ${{ steps.lean.outputs.version }}
          BOOTSTRAP_URL: ${{ steps.lean.outputs.bootstrap }}
        run: |
          curl -fL --retry 3 -o lean.tar.zst "$BOOTSTRAP_URL"
          curl -fL --retry 3 -o lean-src.tar.gz \
            "https://github.com/leanprover/lean4/archive/refs/tags/v${VERSION}.tar.gz"
          mkdir -p work/lean-dist work/lean-src
          zstd -d --stdout lean.tar.zst | tar -xf - -C work/lean-dist --strip-components=1
          tar -xzf lean-src.tar.gz -C work/lean-src --strip-components=1
          work/lean-dist/bin/lean --version

      - name: 只把 WHNF.lean 编成 C，再编成 wasm 对象
        env:
          EMSDK: ${{ github.workspace }}/emsdk
        run: |
          source emsdk/emsdk_env.sh
          DIST="$GITHUB_WORKSPACE/work/lean-dist"
          LEAN_PATH="$DIST/lib/lean" "$DIST/bin/lean" -c \
            "$GITHUB_WORKSPACE/work/WHNF.c" \
            "$GITHUB_WORKSPACE/work/lean-src/src/Lean/Meta/WHNF.lean"
          emcc -c -O2 -mtail-call -I"$DIST/include" -o work/WHNF.o work/WHNF.c
          wasm2wat --enable-all work/WHNF.o -o work/WHNF.wat
          wc -l work/WHNF.wat

      - name: 断言热点环上 0 条 return_call
        run: |
          node --input-type=module - <<'NODE'
          import { readFileSync } from 'node:fs';

          const lines = readFileSync('work/WHNF.wat', 'utf8').split('\n');
          // wasm2wat 的平铺格式里函数没有独立收尾行，下一个 `(func $` 就是上一个的结束。
          // 只认热点环本体：___boxed / ___lam__ / _at___ 里被内联进来的旁支不算。
          const hot = [
            /^lean_whnf$/,
            /Lean_Meta_whnfEasyCases$/,
            /Lean_Meta_whnfEasyCases___at___00Lean_Meta_whnfImp_spec__4$/,
            /Lean_Meta_whnfEasyCases___at___00.*Lean_Meta_whnfCore_go_spec__3$/,
            /Lean_Meta_reduceRec___redArg$/,
            /Lean_Meta_reduceQuotRec___redArg$/,
          ];
          const rows = [];
          let name = null;
          let bodyLines = 0;
          let returnCalls = 0;
          let totalReturnCalls = 0;

          const flush = () => {
            if (name && hot.some((pattern) => pattern.test(name))) {
              rows.push({ name, bodyLines, returnCalls });
            }
            name = null;
          };

          for (const line of lines) {
            if (line.includes('return_call')) totalReturnCalls += 1;
            const start = line.match(/^  \(func \$(\S+)/);
            if (start) {
              flush();
              name = start[1];
              bodyLines = 0;
              returnCalls = 0;
            }
            if (name === null) continue;
            bodyLines += 1;
            if (line.includes('return_call')) returnCalls += 1;
          }
          flush();

          if (rows.length < 4) {
            throw new Error(`只匹配到 ${rows.length} 个热点函数，符号名可能变了`);
          }
          const withTail = rows.filter((row) => row.returnCalls > 0);
          console.log(`全对象 return_call: ${totalReturnCalls}`);
          for (const row of rows) {
            console.log(`${row.name}\t${row.bodyLines} 行\treturn_call=${row.returnCalls}`);
          }
          if (withTail.length > 0) {
            throw new Error(`热点环出现尾调用: ${withTail.map((row) => row.name).join(', ')}`);
          }
          NODE

      - name: 保存审计产物
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: whnf-audit
          path: |
            work/WHNF.wat
            work/WHNF.c
          retention-days: 7
          if-no-files-found: warn

  # [whnf-stack] 标记：验证显式工作栈版本的 whnfCore 能否编译、递归环是否消失。
  whnf-stack:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.whnf_stack) ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[whnf-stack]'))
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: 安装 zstd、wabt 与 patch
        run: sudo apt-get update && sudo apt-get install -y zstd wabt patch

      - name: 缓存 Emscripten 6.0.0
        uses: actions/cache@v6
        with:
          path: emsdk
          key: depth-probe-emsdk-6.0.0-v1

      - name: 安装 Emscripten 6.0.0
        run: |
          if [ ! -x emsdk/upstream/emscripten/emcc ]; then
            git clone --depth 1 https://github.com/emscripten-core/emsdk.git
            (cd emsdk && ./emsdk install 6.0.0 && ./emsdk activate 6.0.0)
          fi
          source emsdk/emsdk_env.sh
          emcc --version | head -n 2

      # 版本统一从 scripts/pin-lean.ts 读取，升级时不改这里。
      - name: 解析 Lean pin
        id: lean
        run: |
          # shellcheck disable=SC2016 # 单引号里是 JS 模板字符串，由 node 自己展开。
          node -e 'import("./scripts/pin-lean.ts").then((m) => {
            const p = m.resolveLeanPin();
            console.log(`version=${p.version}`);
            console.log(`bootstrap=${p.bootstrapUrl}`);
          })' >> "$GITHUB_OUTPUT"

      - name: 下载 Lean ${{ steps.lean.outputs.version }}（发行包 + 源码）
        env:
          VERSION: ${{ steps.lean.outputs.version }}
          BOOTSTRAP_URL: ${{ steps.lean.outputs.bootstrap }}
        run: |
          curl -fL --retry 3 -o lean.tar.zst "$BOOTSTRAP_URL"
          curl -fL --retry 3 -o lean-src.tar.gz \
            "https://github.com/leanprover/lean4/archive/refs/tags/v${VERSION}.tar.gz"
          mkdir -p work/lean-dist work/lean-src
          zstd -d --stdout lean.tar.zst | tar -xf - -C work/lean-dist --strip-components=1
          tar -xzf lean-src.tar.gz -C work/lean-src --strip-components=1
          work/lean-dist/bin/lean --version

      - name: 应用显式工作栈补丁
        run: |
          patch -p1 -d work/lean-src < scripts/patches/lean-whnf-stack.patch
          # 旧的 Go/Finish 双函数版本已合并成单一状态机；源码里还能搜到它们说明补丁过期。
          if grep -qE 'whnfCoreGo|whnfCoreFinish' work/lean-src/src/Lean/Meta/WHNF.lean; then
            echo '补丁仍在用旧的 Go/Finish 双函数，互递归不会被编成尾调用' >&2
            exit 1
          fi
          grep -c 'whnfCoreStep' work/lean-src/src/Lean/Meta/WHNF.lean

      - name: 编译补丁后的 WHNF.lean 并生成 wasm 对象
        env:
          EMSDK: ${{ github.workspace }}/emsdk
        run: |
          source emsdk/emsdk_env.sh
          DIST="$GITHUB_WORKSPACE/work/lean-dist"
          LEAN_PATH="$DIST/lib/lean" "$DIST/bin/lean" -c \
            "$GITHUB_WORKSPACE/work/WHNF-stack.c" \
            "$GITHUB_WORKSPACE/work/lean-src/src/Lean/Meta/WHNF.lean"
          emcc -c -O2 -mtail-call -I"$DIST/include" -o work/WHNF-stack.o work/WHNF-stack.c
          grep -qE 'LEAN_EXPORT.*__Lean_Meta_whnfCore_go\(' work/WHNF-stack.c
          wasm2wat --enable-all work/WHNF-stack.o -o work/WHNF-stack.wat
          wc -l work/WHNF-stack.wat

      - name: 断言 whnfCoreStep 不再压原生栈
        run: |
          node --input-type=module - <<'NODE'
          import { readFileSync } from 'node:fs';

          const lines = readFileSync('work/WHNF-stack.wat', 'utf8').split('\n');
          // wasm2wat 的平铺格式里函数没有独立收尾行，下一个 `(func $` 就是上一个的结束。
          const funcs = [];
          let current = null;
          for (const line of lines) {
            const start = line.match(/^  \(func \$(\S+)/);
            if (start) {
              current = { name: start[1], body: [] };
              funcs.push(current);
              continue;
            }
            if (current) current.body.push(line);
          }

          // 只认状态机本体：`whnfCore` 前缀还会命中一堆内联生成的 ___at___00*_spec__N
          // 和 matcher 辅助函数，它们不是递归环。
          const hot = funcs.filter((f) => /whnfCoreStep(_redArg)?$/.test(f.name));
          if (hot.length === 0) {
            throw new Error('没有找到 whnfCoreStep 函数，符号名可能变了');
          }
          let plainSelf = 0;
          let tailSelf = 0;
          for (const f of hot) {
            const calls = f.body.filter((line) => line.includes(`call $${f.name}`)).length;
            const tails = f.body.filter((line) => line.includes(`return_call $${f.name}`)).length;
            plainSelf += calls;
            tailSelf += tails;
            console.log(`${f.name}\t${f.body.length} 行\tcall=${calls}\treturn_call=${tails}`);
          }
          // 自尾调用被 LLVM 编成循环（call=0 / return_call=0 都算消除）；
          // 只要还有普通 call，每层归约就仍会压 1 MB 原生栈。
          if (plainSelf > 0) {
            throw new Error(`显式栈版本仍在普通自调用 ${plainSelf} 处`);
          }
          console.log(`普通自调用 0 处；return_call ${tailSelf} 处`);
          NODE

      - name: 保存实验产物
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: whnf-stack
          path: |
            work/WHNF-stack.wat
            work/WHNF-stack.c
          retention-days: 7
          if-no-files-found: warn
