name: Smoke

on:
  workflow_dispatch:
    inputs:
      origin:
        description: 目标站点
        required: false
        # 手动触发默认也打 pages.dev：机房 IP 访问自定义域会被机器人规则拦成 403。
        default: https://lean-init-ide.pages.dev
  schedule:
    # 每天 01:00 UTC 巡检一次，捕捉证书、路由、Functions 的静默回归。
    - cron: '0 1 * * *'

permissions:
  contents: read

jobs:
  smoke:
    name: 线上冒烟
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # 不依赖 node_modules：脚本只用 Node 内置模块和系统 curl。
      # 探测 pages.dev 而不是自定义域：机房 IP 会被 zone 的机器人规则拦成 403，
      # 那是安全策略生效，不是站点故障。自定义域由浏览器侧人工确认。
      - name: 探测主站
        run: node scripts/smoke.mjs
        env:
          LEAN_SITE_ORIGIN: ${{ inputs.origin || 'https://lean-init-ide.pages.dev' }}
