name: 投稿趣味挑战 / New puzzle idea
description: 提议一道适合零基础用户、能在一分钟内看懂的数学谜题
title: '[挑战投稿] '
body:
  - type: markdown
    attributes:
      value: |
        好题的标准：一句人话能讲清、结果有点反直觉、证明只依赖 Init。
        A good puzzle: one plain-language sentence, a slightly surprising result, and a proof that needs only Init.
  - type: input
    id: title
    attributes:
      label: 谜题标题 / Puzzle title
      placeholder: 读心术：为什么结果永远是 2？
    validations:
      required: true
  - type: textarea
    id: hook
    attributes:
      label: 一句话钩子 / One-sentence hook
      description: 让非程序员也愿意点开的那句话
    validations:
      required: true
  - type: textarea
    id: math
    attributes:
      label: 数学内核 / Mathematical idea
      description: 涉及什么概念？为什么值得证明？
    validations:
      required: true
  - type: textarea
    id: lean
    attributes:
      label: Lean 草稿（可选）/ Lean sketch (optional)
      description: 如果能给出只依赖 Init 的骨架或证明，Agent 会更容易落地
      placeholder: |
        theorem my_puzzle (n : Nat) : ... := by
          sorry
