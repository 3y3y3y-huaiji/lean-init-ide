<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lean Init IDE</title>
    <meta
      name="description"
      content="在浏览器里学 Lean 4：Monaco 编辑器 + 运行在 Web Worker 里的 Lean 语言服务器，无需安装工具链。"
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#0b0f14" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Lean Init IDE" />
    <meta property="og:title" content="Lean Init IDE" />
    <meta
      property="og:description"
      content="在浏览器里学 Lean 4：真实的 Lean 语言服务器跑在 Web Worker 里，无需安装工具链。"
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Lean Init IDE" />
    <meta
      name="twitter:description"
      content="在浏览器里学 Lean 4：真实的 Lean 语言服务器跑在 Web Worker 里，无需安装工具链。"
    />
    <link rel="preconnect" href="https://raw.githubusercontent.com" crossorigin />
    <script>
      // 首屏绘制前确定主题，避免闪白或闪黑。
      (() => {
        try {
          const stored = localStorage.getItem('lean:theme');
          const pref =
            stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system';
          const systemLight = window.matchMedia('(prefers-color-scheme: light)').matches;
          const resolved = pref === 'system' ? (systemLight ? 'light' : 'dark') : pref;
          document.documentElement.dataset.theme = resolved;
          document.documentElement.dataset.themePreference = pref;
        } catch {
          // localStorage 不可用时保留默认暗色。
        }
      })();
    </script>
  </head>
  <body data-page="content">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
