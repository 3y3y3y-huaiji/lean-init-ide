name: Spike wasm64

# 仅用于 spike/wasm64 分支：验证 Lean 4 能否以 wasm64（64 位指针）构建，
# 以及能否直接加载官方 64 位 Init oleans。不要合并到 main。
on:
  push:
    branches: [spike/wasm64]
  workflow_dispatch:

permissions:
  contents: read

# 长构建不能被随手一推杀掉；新提交排队等待。
concurrency:
  group: spike-wasm64
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7

      - name: 安装构建依赖
        run: sudo apt-get update && sudo apt-get install -y cmake zstd

      - name: 缓存 Emscripten 6.0.0
        uses: actions/cache@v6
        with:
          path: emsdk
          key: wasm64-emsdk-6.0.0-v1

      - name: 安装 Emscripten 6.0.0
        run: |
          if [ ! -x emsdk/upstream/emscripten/emcc ]; then
            git clone --depth 1 https://github.com/emscripten-core/emsdk.git
            (cd emsdk && ./emsdk install 6.0.0 && ./emsdk activate 6.0.0)
          fi
          source emsdk/emsdk_env.sh
          emcc --version | head -n 2

      - name: 探测 memory64 + pthreads
        run: |
          source emsdk/emsdk_env.sh
          cat > probe.c <<'EOF'
          #include <pthread.h>
          #include <stdio.h>
          static void *worker(void *arg) { *(int *)arg = 42; return NULL; }
          int main(void) {
            printf("sizeof(void*)=%zu\n", sizeof(void *));
            pthread_t t;
            int value = 0;
            if (pthread_create(&t, NULL, worker, &value) != 0) {
              puts("pthread_create failed");
              return 2;
            }
            pthread_join(t, NULL);
            printf("value=%d\n", value);
            return value == 42 ? 0 : 3;
          }
          EOF
          emcc probe.c -sMEMORY64=1 -pthread -O2 -sPTHREAD_POOL_SIZE=2 -sENVIRONMENT=node -o probe.mjs
          node probe.mjs

      - name: 准备 wasm-llvm 并切成 wasm64 + O1
        run: |
          git clone --depth 1 https://github.com/seo-rii/wasm-llvm.git wasm-llvm
          cd wasm-llvm
          sed -i \
            -e 's|-DCMAKE_BUILD_TYPE=Release|-DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS=-sMEMORY64=1 -DCMAKE_CXX_FLAGS=-sMEMORY64=1 -DCMAKE_EXE_LINKER_FLAGS=-sMEMORY64=1|' \
            -e 's|emcc -c -O2|emcc -sMEMORY64=1 -c -O2|g' \
            -e 's|emcc -O2 -pthread|emcc -sMEMORY64=1 -O2 -pthread|g' \
            -e 's|-sMODULARIZE=1|-sEXCEPTION_STACK_TRACES=1 --profiling-funcs -sMODULARIZE=1|' \
            -e 's|-sINITIAL_MEMORY=268435456|-sINITIAL_MEMORY=2147483648|' \
            -e 's|-sDEFAULT_PTHREAD_STACK_SIZE=8388608|-sDEFAULT_PTHREAD_STACK_SIZE=67108864|' \
            producer/lean-browser/scripts/build.sh
          grep -n -- 'MEMORY64\|EXCEPTION_STACK_TRACES' producer/lean-browser/scripts/build.sh

      - name: 缓存 Lean 源码与引导包
        uses: actions/cache@v6
        with:
          path: |
            work/lean4
            work/lean-*-linux
          key: wasm64-src-v4

      - name: fetch
        run: |
          source emsdk/emsdk_env.sh
          cd wasm-llvm
          export EMSDK="$GITHUB_WORKSPACE/emsdk"
          export WASM_LLVM_LEAN_WORK_DIR="$GITHUB_WORKSPACE/work"
          export WASM_LLVM_LEAN_JOBS=3
          # 缓存里的源码可能带着上一次的本地修改；先恢复干净，让 fetch 重新应用 pinned patch。
          if [ -d "$WASM_LLVM_LEAN_WORK_DIR/lean4/.git" ]; then
            git -C "$WASM_LLVM_LEAN_WORK_DIR/lean4" reset --hard -q HEAD
            git -C "$WASM_LLVM_LEAN_WORK_DIR/lean4" clean -fdq
          fi
          bash producer/lean-browser/scripts/build.sh fetch
          # LibUV 的 ExternalProject 只接收 EMSCRIPTEN_SETTINGS 作为 CMAKE_C_FLAGS，
          # 不带上 64 位指针选项会编出 wasm32 的 libuv.a，链接时报 "wasm32 object file can't be linked in wasm64 mode"。
          sed -i 's|set(EMSCRIPTEN_SETTINGS "-s ALLOW_MEMORY_GROWTH=1 -fwasm-exceptions -pthread")|set(EMSCRIPTEN_SETTINGS "-sMEMORY64=1 -s ALLOW_MEMORY_GROWTH=1 -fwasm-exceptions -pthread")|' \
            "$WASM_LLVM_LEAN_WORK_DIR/lean4/src/CMakeLists.txt"
          grep -n 'EMSCRIPTEN_SETTINGS' "$WASM_LLVM_LEAN_WORK_DIR/lean4/src/CMakeLists.txt" | head -n 3
          # 诊断：Lean 的初始化错误通过 Except 返回，异常栈里看不到是哪一级失败的。
          # 直接给 Init / Std / Lean 三个顶层初始化打点，失败时 stderr 的最后一行就是坏掉的那一级。
          INIT="$WASM_LLVM_LEAN_WORK_DIR/lean4/src/initialize/init.cpp"
          sed -i '1i #include <cstdio>' "$INIT"
          sed -i 's|^\( *\)consume_io_result(initialize_Init(builtin));|\1fprintf(stderr, "INIT Init\\n"); fflush(stderr);\n\1consume_io_result(initialize_Init(builtin));|' "$INIT"
          sed -i 's|^\( *\)consume_io_result(initialize_Std(builtin));|\1fprintf(stderr, "INIT Std\\n"); fflush(stderr);\n\1consume_io_result(initialize_Std(builtin));|' "$INIT"
          sed -i 's|^\( *\)consume_io_result(initialize_Lean(builtin));|\1fprintf(stderr, "INIT Lean\\n"); fflush(stderr);\n\1consume_io_result(initialize_Lean(builtin));|' "$INIT"
          grep -n 'INIT Init\|INIT Std\|INIT Lean' "$INIT"

      - name: backport 上游 wasm64 修复
        run: |
          python3 - <<'PY'
          import pathlib

          src = pathlib.Path("work/lean4")

          # 上游 #15814 / PR #15816：静态构造对象的标量字段按 8 字节写入，
          # LEAN_SCALAR_PTR_LITERAL 必须按指针宽度选择 4/8 字节形式。
          # v4.34.1 用 LEAN_EMSCRIPTEN 判断，wasm64 下会走 4 字节形式，导致 Name 哈希被截断。
          lean_h = src / "src/include/lean/lean.h"
          text = lean_h.read_text()
          old = "#ifdef LEAN_EMSCRIPTEN\n#define LEAN_SCALAR_PTR_LITERAL"
          new = "#if UINTPTR_MAX == UINT32_MAX\n#define LEAN_SCALAR_PTR_LITERAL"
          if old in text:
              lean_h.write_text(text.replace(old, new, 1))
              print("patched lean.h")
          elif new in text:
              print("lean.h already patched")
          else:
              raise SystemExit("lean.h anchor not found")

          # 上游 #14886：C++ 侧声明返回 uint8*，Lean 导出的是 Bool（uint8）。
          env = src / "src/kernel/environment.cpp"
          text = env.read_text()
          old = 'extern "C" uint8* lean_kernel_diag_is_enabled(object*);'
          new = 'extern "C" uint8 lean_kernel_diag_is_enabled(object*);'
          if old in text:
              env.write_text(text.replace(old, new))
              print("patched environment.cpp")
          elif new in text:
              print("environment.cpp already patched")
          else:
              print("environment.cpp anchor missing (非致命)")

          # thread.cpp 把 Emscripten 的默认线程栈写死成 8MB（按 32 位帧大小估算），
          # wasm64 帧更大，Init.Prelude 的 getHeadInfo? 深递归会栈溢出。
          thread_cpp = src / "src/runtime/thread.cpp"
          text = thread_cpp.read_text()
          old = "#define LEAN_DEFAULT_THREAD_STACK_SIZE 8*1024*1024 // 8MB for 32-bit"
          new = "#define LEAN_DEFAULT_THREAD_STACK_SIZE 64*1024*1024 // 64MB for wasm64"
          if old in text:
              thread_cpp.write_text(text.replace(old, new))
              print("patched thread.cpp")
          elif new in text:
              print("thread.cpp already patched")
          else:
              print("thread.cpp anchor missing (非致命)")
          PY

      - name: 缓存 runtime 产物
        uses: actions/cache@v6
        with:
          path: |
            work/build-wasm
            work/emcache
          key: wasm64-runtime-v10

      - name: runtime
        run: |
          source emsdk/emsdk_env.sh
          cd wasm-llvm
          export EMSDK="$GITHUB_WORKSPACE/emsdk"
          export WASM_LLVM_LEAN_WORK_DIR="$GITHUB_WORKSPACE/work"
          export WASM_LLVM_LEAN_JOBS=3
          bash producer/lean-browser/scripts/build.sh emsdk runtime

      - name: 缓存 cgen（机器生成的 C 源码）
        uses: actions/cache@v6
        with:
          path: work/cgen
          key: wasm64-cgen-v1

      - name: cgen
        run: |
          source emsdk/emsdk_env.sh
          cd wasm-llvm
          export EMSDK="$GITHUB_WORKSPACE/emsdk"
          export WASM_LLVM_LEAN_WORK_DIR="$GITHUB_WORKSPACE/work"
          export WASM_LLVM_LEAN_JOBS=3
          bash producer/lean-browser/scripts/build.sh cgen

  finish:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7

      - name: 安装构建依赖
        run: sudo apt-get update && sudo apt-get install -y cmake zstd

      - name: 缓存 Emscripten 6.0.0
        uses: actions/cache@v6
        with:
          path: emsdk
          key: wasm64-emsdk-6.0.0-v1

      - name: 安装 Emscripten 6.0.0
        run: |
          if [ ! -x emsdk/upstream/emscripten/emcc ]; then
            git clone --depth 1 https://github.com/emscripten-core/emsdk.git
            (cd emsdk && ./emsdk install 6.0.0 && ./emsdk activate 6.0.0)
          fi
          source emsdk/emsdk_env.sh
          emcc --version | head -n 2

      - name: 准备 wasm-llvm 并切成 wasm64 + O1
        run: |
          git clone --depth 1 https://github.com/seo-rii/wasm-llvm.git wasm-llvm
          cd wasm-llvm
          sed -i \
            -e 's|-DCMAKE_BUILD_TYPE=Release|-DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS=-sMEMORY64=1 -DCMAKE_CXX_FLAGS=-sMEMORY64=1 -DCMAKE_EXE_LINKER_FLAGS=-sMEMORY64=1|' \
            -e 's|emcc -c -O2|emcc -sMEMORY64=1 -c -O2|g' \
            -e 's|emcc -O2 -pthread|emcc -sMEMORY64=1 -O2 -pthread|g' \
            -e 's|-sMODULARIZE=1|-sEXCEPTION_STACK_TRACES=1 --profiling-funcs -sMODULARIZE=1|' \
            -e 's|-sINITIAL_MEMORY=268435456|-sINITIAL_MEMORY=2147483648|' \
            -e 's|-sDEFAULT_PTHREAD_STACK_SIZE=8388608|-sDEFAULT_PTHREAD_STACK_SIZE=67108864|' \
            producer/lean-browser/scripts/build.sh
          grep -n -- 'MEMORY64\|EXCEPTION_STACK_TRACES' producer/lean-browser/scripts/build.sh

      - name: 恢复 Lean 源码与引导包
        uses: actions/cache@v6
        with:
          path: |
            work/lean4
            work/lean-*-linux
          key: wasm64-src-v4

      - name: backport 上游 wasm64 修复
        run: |
          python3 - <<'PY'
          import pathlib

          src = pathlib.Path("work/lean4")
          lean_h = src / "src/include/lean/lean.h"
          text = lean_h.read_text()
          old = "#ifdef LEAN_EMSCRIPTEN\n#define LEAN_SCALAR_PTR_LITERAL"
          new = "#if UINTPTR_MAX == UINT32_MAX\n#define LEAN_SCALAR_PTR_LITERAL"
          if old in text:
              lean_h.write_text(text.replace(old, new, 1))
              print("patched lean.h")
          elif new in text:
              print("lean.h already patched")
          else:
              raise SystemExit("lean.h anchor not found")

          env = src / "src/kernel/environment.cpp"
          text = env.read_text()
          old = 'extern "C" uint8* lean_kernel_diag_is_enabled(object*);'
          new = 'extern "C" uint8 lean_kernel_diag_is_enabled(object*);'
          if old in text:
              env.write_text(text.replace(old, new))
              print("patched environment.cpp")
          elif new in text:
              print("environment.cpp already patched")
          else:
              print("environment.cpp anchor missing (非致命)")
          PY

      - name: 恢复 runtime 产物
        uses: actions/cache@v6
        with:
          path: |
            work/build-wasm
            work/emcache
          key: wasm64-runtime-v10

      - name: 恢复 cgen
        uses: actions/cache@v6
        with:
          path: work/cgen
          key: wasm64-cgen-v1

      # 诊断：确认 level category 注册后立刻查不到，是 Name 的 hash/eq 不一致，还是 map 本身丢了写入。
      # 只改动 Level.c，复用 objects 缓存，几分钟一轮。
      - name: 在 Level 初始化里插入 Name / 查表探针
        run: |
          python3 - <<'PY'
          import pathlib, re

          probe_names = r'''
          {
            extern lean_object* lean_name_mk_string(lean_object*, lean_object*);
            extern lean_object* lean_mk_string(char const*);
            lean_object* pa = lean_name_mk_string(lean_box(0), lean_mk_string("level"));
            lean_object* pb = lean_name_mk_string(lean_box(0), lean_mk_string("level"));
            fprintf(stderr, "PROBE name eq=%d h1=%llu h2=%llu\n",
                    (int)lean_name_eq(pa, pb),
                    (unsigned long long)lean_name_hash(pa),
                    (unsigned long long)lean_name_hash(pb));
          }
          '''

          probe_category = r'''
          {
            extern lean_object* lean_name_mk_string(lean_object*, lean_object*);
            extern lean_object* lean_mk_string(char const*);
            extern lean_object* l_Lean_Parser_addBuiltinLeadingParser(lean_object*, lean_object*, lean_object*, lean_object*);
            lean_object* pc = lean_name_mk_string(lean_box(0), lean_mk_string("level"));
            lean_object* pd = lean_name_mk_string(lean_box(0), lean_mk_string("probeLevel"));
            lean_object* pr = l_Lean_Parser_addBuiltinLeadingParser(pc, pd, l_Lean_Parser_Level_paren, lean_box(0));
            fprintf(stderr, "PROBE addLeading is_error=%d\n", (int)lean_io_result_is_error(pr));
            lean_dec_ref(pr);
          }
          '''

          candidates = []
          for p in pathlib.Path("work/cgen").rglob("*.c"):
              text = p.read_text(errors="ignore")
              if re.search(r"runtime_initialize_Lean_Parser_Level\(uint8_t builtin\)\s*\{", text):
                  candidates.append(p)
          print("files defining Level runtime init:", [str(p) for p in candidates])
          if not candidates:
              raise SystemExit("Level runtime init definition not found")

          path = candidates[0]
          src = path.read_text()
          if "#include <stdio.h>" not in src:
              src = "#include <stdio.h>\n" + src

          header = re.search(r"runtime_initialize_Lean_Parser_Level\(uint8_t builtin\)\s*\{", src)
          if not header:
              print("probe A: function header missing")
          else:
              brace = header.end() - 1
              print("probe A context:", repr(src[max(0, brace - 120):brace + 60]))
              src = src[:brace + 1] + "\n" + probe_names + src[brace + 1:]
              print("probe A injected at function entry")

          lines = src.splitlines(keepends=True)
          target = None
          for i, line in enumerate(lines):
              if re.match(r"\s*res\s*=\s*[^\n]*_Level_paren___regBuiltin[^\n]*\(\);\s*$", line):
                  target = i
                  break
          if target is None:
              print("probe B: call line missing")
          else:
              print("probe B context:", repr("".join(lines[max(0, target - 1):target + 1])))
              lines.insert(target, probe_category + "\n")
              src = "".join(lines)
              print("probe B injected before paren regBuiltin call")

          # 给 Level.c 里每一次 regBuiltin 调用加标记，并标出 runtime/meta 阶段入口，
          # 定位到底是哪一次注册在报 unknown parser category。
          marked = []
          for line in src.splitlines(keepends=True):
              ident = re.search(r"(l_\w+_regBuiltin\w*)\(\)", line)
              if ident and line.lstrip().startswith("res"):
                  marked.append(f'fprintf(stderr, "REG {ident.group(1)}\\n");\n')
                  marked.append(line)
              else:
                  marked.append(line)
          src = "".join(marked)

          # 在 Extension.c 的 addBuiltinLeadingParser 入口打印 catName 哈希，
          # 与探针里新建的 level Name 哈希对比。
          ext = pathlib.Path("work/cgen/Lean/Parser/Extension.c")
          if ext.exists():
              esrc = ext.read_text()
              if "#include <stdio.h>" not in esrc:
                  esrc = "#include <stdio.h>\n" + esrc
              for fn in ("l_Lean_Parser_addBuiltinLeadingParser", "l_Lean_Parser_addBuiltinParser"):
                  m = re.search(rf"{fn}\(lean_object\* (\w+)", esrc)
                  if m:
                      param = m.group(1)
                      brace = esrc.find("{", m.end())
                      inject = f'\nfprintf(stderr, "CAT {fn} hash=%llu\\n", (unsigned long long)lean_name_hash({param}));'
                      esrc = esrc[:brace + 1] + inject + esrc[brace + 1:]
                      print("cat probe added:", fn, param)
                  else:
                      print("cat probe: header missing for", fn)
              ext.write_text(esrc)

          for phase in ("runtime_initialize_Lean_Parser_Level", "meta_initialize_Lean_Parser_Level"):
              header = re.search(rf"{phase}\(uint8_t builtin\)\s*\{{", src)
              if header:
                  brace = header.end() - 1
                  src = src[:brace + 1] + f'\nfprintf(stderr, "PHASE {phase}\\n");' + src[brace + 1:]
                  print("phase marker added:", phase)
              else:
                  print("phase header missing:", phase)

          path.write_text(src)
          print("patched", path, len(src), "bytes")
          PY

      - name: 缓存 64 位 oleans
        uses: actions/cache@v6
        with:
          path: work/olean32
          key: wasm64-oleans-v1

      - name: 缓存 objects
        uses: actions/cache@v6
        with:
          path: work/obj
          key: wasm64-obj-v7

      - name: 写入 emsdk 路径（后续阶段不再重复检查）
        run: |
          source emsdk/emsdk_env.sh
          cd wasm-llvm
          export EMSDK="$GITHUB_WORKSPACE/emsdk"
          export WASM_LLVM_LEAN_WORK_DIR="$GITHUB_WORKSPACE/work"
          export WASM_LLVM_LEAN_JOBS=3
          bash producer/lean-browser/scripts/build.sh emsdk

      - name: objects
        id: objects
        run: |
          source emsdk/emsdk_env.sh
          cd wasm-llvm
          export EMSDK="$GITHUB_WORKSPACE/emsdk"
          export WASM_LLVM_LEAN_WORK_DIR="$GITHUB_WORKSPACE/work"
          export WASM_LLVM_LEAN_JOBS=3
          bash producer/lean-browser/scripts/build.sh objects

      # 浏览器验证失败会让 Job 失败，actions/cache 的 Post 阶段就不会保存 objects，
      # 于是每次迭代都要重编 649 个模块。这里在 objects 成功后立刻显式保存。
      - name: 立即保存 objects 缓存
        if: always() && steps.objects.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: work/obj
          key: wasm64-obj-v7

      - name: link
        run: |
          source emsdk/emsdk_env.sh
          cd wasm-llvm
          export EMSDK="$GITHUB_WORKSPACE/emsdk"
          export WASM_LLVM_LEAN_WORK_DIR="$GITHUB_WORKSPACE/work"
          export WASM_LLVM_LEAN_JOBS=3
          bash producer/lean-browser/scripts/build.sh link

      # 判定探针：不 import 任何模块的最小文件能否编译。
      # 通过 → 崩溃与 Init.Prelude 的深递归/规模有关；失败 → 运行时 baseline 就坏了。
      - name: 最小文件探针（不 import Init）
        run: |
          set +e
          mkdir -p work/mini
          printf 'def one : Nat := 1\n' > work/mini/Mini.lean
          node wasm-llvm/producer/lean-browser/scripts/run-lean.mjs \
            work/dist/lean.mjs work/mini work/olean32 -- \
            -j1 -o /lean/lib/lean/Mini.olean /src/Mini.lean
          echo "mini exit=$?"

      # 官方 olean 是 GMP 编码（flags=1），我们的 wasm64 运行时是 USE_GMP=OFF，
      # 头校验过不了。改为用这个 wasm64 Lean 自己重编 Init，得到 flags=0 的 64 位 oleans。
      - name: 自生成 64 位 Init oleans
        timeout-minutes: 300
        run: |
          source emsdk/emsdk_env.sh
          cd wasm-llvm
          export EMSDK="$GITHUB_WORKSPACE/emsdk"
          export WASM_LLVM_LEAN_WORK_DIR="$GITHUB_WORKSPACE/work"
          export WASM_LLVM_LEAN_JOBS=1
          BOOT="$(ls -d "$WASM_LLVM_LEAN_WORK_DIR"/lean-*-linux | head -n 1)"
          # modules.txt 由 cgen 阶段生成；cgen 命中缓存时不会重跑，这里补一次。
          (cd "$BOOT/lib/lean" && find Init Std Lean -name '*.olean' | sed 's/\.olean$//'; printf '%s\n' Init Std Lean) \
            | LC_ALL=C sort > "$WASM_LLVM_LEAN_WORK_DIR/modules.txt"
          bash producer/lean-browser/scripts/build.sh oleans
          find "$WASM_LLVM_LEAN_WORK_DIR/olean32" -name '*.olean' | wc -l

      - name: 生成自建 Init olean 清单
        run: |
          OLEANS="$GITHUB_WORKSPACE/work/olean32"
          node -e '
          const { readdirSync, writeFileSync } = require("node:fs");
          const { join, relative } = require("node:path");
          const root = process.argv[1];
          const out = [];
          const walk = (dir) => {
            for (const entry of readdirSync(dir, { withFileTypes: true })) {
              const p = join(dir, entry.name);
              if (entry.isDirectory()) walk(p);
              else if (/[.](olean|ilean)$/.test(entry.name)) out.push(relative(root, p));
            }
          };
          walk(join(root, "Init"));
          out.push("Init.olean");
          out.sort();
          writeFileSync("work/dist/olean-manifest.json", JSON.stringify(out));
          console.log("olean files:", out.length);
          ' "$OLEANS"
          du -sh "$OLEANS/Init"

      - name: 准备浏览器驱动（pnpm + runner 自带 Chrome，不下载浏览器）
        run: |
          corepack enable
          corepack prepare pnpm@12.18.0 --activate
          mkdir -p work/browser
          cd work/browser
          pnpm init > /dev/null
          pnpm pkg set type=module
          pnpm add playwright-core tsx esbuild --allow-build=esbuild
          cp ../../scripts/wasm64-browser-verify.ts .
          pnpm exec esbuild ../../scripts/wasm64-browser-harness.ts --bundle --format=esm --outfile=../../work/dist/harness.mjs

      - name: 关键验证：runner 自带 Chrome（Memory64 原生支持）里用自建 64 位 oleans 编译
        timeout-minutes: 30
        run: |
          cd work/browser
          pnpm exec tsx wasm64-browser-verify.ts ../../work/dist ../../work/olean32

      - name: 保存产物与日志
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wasm64-spike
          path: |
            work/dist/**
            work/*.log
            work/*.olean-fail.log
          if-no-files-found: warn
