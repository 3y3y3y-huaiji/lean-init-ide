name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: 静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 代码格式
        run: pnpm run format:check
      - name: ESLint
        run: pnpm run lint
      - name: 类型检查（应用 / Service Worker / Pages Functions）
        run: pnpm run typecheck
      - name: 资产清单结构
        run: pnpm run verify:manifest

  test:
    name: 单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 覆盖率阈值写在 vitest.config.ts，低于阈值即失败。
      - run: pnpm test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  build:
    name: 构建产物
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # build:web 跳过 102 MB 资产下载，运行时由 /cdn 网关按需拉取。
      - run: pnpm run build:web
      - name: 产物契约
        run: pnpm run verify:build
      # E2E 直接复用这份 dist，避免再跑一次 vite build，也保证测的是同一份产物。
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 1

  e2e:
    name: 浏览器端到端
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      # 和 deploy 共用同一份资产缓存；命中时 fetch:assets 只做哈希校验。
      - name: 缓存 Lean 资产
        uses: actions/cache@v6
        with:
          path: public/wasm-lean4
          key: lean-assets-${{ hashFiles('config/lean4-runtime.json') }}
      - name: 准备 Lean 资产
        run: pnpm run fetch:assets
      # build:web 的 dist 不含 wasm-lean4；小资产（index.json/lean.mjs 等）不走 SW，
      # 必须补回静态副本，否则会落到网关的 SPA 回退。
      - name: 补齐静态兜底资产
        run: mkdir -p dist/wasm-lean4 && cp -r public/wasm-lean4/. dist/wasm-lean4/
      - name: 启动本地等价网关
        run: |
          node scripts/local-gateway.mjs > /tmp/gateway.log 2>&1 &
          for _ in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:4174/__health >/dev/null; then
              exit 0
            fi
            sleep 0.2
          done
          cat /tmp/gateway.log
          exit 1
      - name: 浏览器启动 Lean 并检查诊断
        env:
          LEAN_E2E_CHANNEL: chrome
        run: node scripts/e2e-lean.mjs
      - name: 逐课运行全部代码块
        env:
          LEAN_E2E_CHANNEL: chrome
          LEAN_E2E_WORKERS: 3
        run: node scripts/e2e-lessons.mjs

  audit:
    name: 依赖审计
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 只审生产依赖：开发工具链的告警不阻塞发布，但会在日志里可见。
      - name: 生产依赖高危漏洞
        run: pnpm audit --prod --audit-level high

  deploy:
    name: 部署
    needs: [static, test, build, e2e, audit]
    # 只在 main 且显式开启 CD 时执行；配好 Secrets 与 CD_ENABLED 之前自动跳过。
    if: github.ref == 'refs/heads/main' && vars.CD_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 认证失败时 wrangler 只回一句 9106，看不出是 token 值坏了还是权限不够。
      - name: 诊断部署凭据
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "token 长度: ${#TOKEN}"
          case "$TOKEN" in
            *[[:space:]]*) echo "token 含空白字符，多半是复制时带了换行或空格"; exit 1 ;;
            *) echo "token 无空白字符" ;;
          esac
          echo "account id 长度: ${#ACCOUNT}"
          code=$(curl -s -o /tmp/probe.json -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/pages/projects")
          echo "API 状态码: $code"
          head -c 400 /tmp/probe.json
          echo
          [ "$code" = "200" ] || exit 1
      # 必须用完整 build：build:web 会跳过 102 MB 兜底副本，丢掉 SW 的第三级回退。
      - name: 缓存 Lean 资产
        uses: actions/cache@v6
        with:
          path: public/wasm-lean4
          key: lean-assets-${{ hashFiles('config/lean4-runtime.json') }}
      - run: pnpm run build
      - run: pnpm run verify:build
      - name: 推送到 Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm dlx wrangler@4 pages deploy dist --project-name=lean-init-ide --branch=main
      # 部署是原子的，但自定义域传播需要几秒，失败重试而不是立刻判定发布失败。
      # 打 pages.dev 而不是主域：CI 的机房 IP 会被 zone 的机器人规则拦成 403，
      # 那是安全策略生效，不代表产物有问题。
      - name: 线上冒烟
        env:
          LEAN_SITE_ORIGIN: https://lean-init-ide.pages.dev
        run: |
          for attempt in 1 2 3 4 5; do
            if node scripts/smoke.mjs; then
              exit 0
            fi
            echo "第 ${attempt} 次冒烟未通过，10 秒后重试"
            sleep 10
          done
          echo "冒烟连续失败，请按 README 的回滚步骤处理"
          exit 1
