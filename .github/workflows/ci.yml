name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: 静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 代码格式
        run: npm run format:check
      - name: ESLint
        run: npm run lint
      - name: 类型检查（应用 / Service Worker / Pages Functions）
        run: npm run typecheck
      - name: 资产清单结构
        run: npm run verify:manifest

  test:
    name: 单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 覆盖率阈值写在 vitest.config.ts，低于阈值即失败。
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  build:
    name: 构建产物
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # build:web 跳过 143 MB 资产下载，运行时由 /cdn 网关按需拉取。
      - run: npm run build:web
      - name: 产物契约
        run: npm run verify:build

  audit:
    name: 依赖审计
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 只审生产依赖：开发工具链的告警不阻塞发布，但会在日志里可见。
      - name: 生产依赖高危漏洞
        run: npm audit --omit=dev --audit-level=high

  deploy:
    name: 部署
    needs: [static, test, build, audit]
    # 只在 main 且显式开启 CD 时执行；配好 Secrets 与 CD_ENABLED 之前自动跳过。
    if: github.ref == 'refs/heads/main' && vars.CD_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 认证失败时 wrangler 只回一句 9106，看不出是 token 值坏了还是权限不够。
      - name: 诊断部署凭据
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "token 长度: ${#TOKEN}"
          case "$TOKEN" in
            *[[:space:]]*) echo "token 含空白字符，多半是复制时带了换行或空格"; exit 1 ;;
            *) echo "token 无空白字符" ;;
          esac
          echo "account id 长度: ${#ACCOUNT}"
          code=$(curl -s -o /tmp/probe.json -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/pages/projects")
          echo "API 状态码: $code"
          head -c 400 /tmp/probe.json
          echo
          [ "$code" = "200" ] || exit 1
      # 必须用完整 build：build:web 会跳过 143 MB 兜底副本，丢掉 SW 的第三级回退。
      - name: 缓存 Lean 资产
        uses: actions/cache@v4
        with:
          path: public/wasm-lean4
          key: lean-assets-${{ hashFiles('config/lean4-runtime.json') }}
      - run: npm run build
      - run: npm run verify:build
      - name: 推送到 Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=lean-init-ide --branch=main
      # 部署是原子的，但自定义域传播需要几秒，失败重试而不是立刻判定发布失败。
      - name: 线上冒烟
        run: |
          for attempt in 1 2 3 4 5; do
            if node scripts/smoke.mjs; then
              exit 0
            fi
            echo "第 ${attempt} 次冒烟未通过，10 秒后重试"
            sleep 10
          done
          echo "冒烟连续失败，请按 README 的回滚步骤处理"
          exit 1
