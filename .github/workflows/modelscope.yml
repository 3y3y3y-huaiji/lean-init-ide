name: ModelScope Mirror

on:
  workflow_dispatch:
    inputs:
      verify_only:
        description: 只校验远端 Range/CORS，不重新上传
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  upload:
    name: 上传运行时资产
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 和 CI 其它 job 共用资产缓存；命中时 fetch:assets 只做哈希校验。
      - name: 缓存 Lean 资产
        uses: actions/cache@v4
        with:
          path: public/wasm-lean4
          key: lean-assets-${{ hashFiles('config/lean4-runtime.json') }}
      - name: 准备 Lean 资产
        run: pnpm run fetch:assets
      - name: 配置 git 身份
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: 检查 ModelScope 配置
        env:
          MODELSCOPE_USERNAME: HQZMSu
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
          MODELSCOPE_REPO: HQZMSu/lean4-assets
        run: |
          echo "username: $MODELSCOPE_USERNAME"
          echo "repo: $MODELSCOPE_REPO"
          echo "token length: ${#MODELSCOPE_TOKEN}"
          if printf '%s' "$MODELSCOPE_TOKEN" | grep -q '[[:space:]]'; then
            echo "token contains whitespace: yes"
          else
            echo "token contains whitespace: no"
          fi
          case "$MODELSCOPE_TOKEN" in
            ghp_*|github_pat_*|gho_*|ghu_*|ghs_*)
              echo "token looks like a GitHub token: yes" ;;
            *)
              echo "token looks like a GitHub token: no" ;;
          esac
      - name: 测试 ModelScope git 认证
        env:
          MODELSCOPE_USERNAME: HQZMSu
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
          MODELSCOPE_REPO: HQZMSu/lean4-assets
        run: |
          set +e
          if GIT_TERMINAL_PROMPT=0 git ls-remote "https://www.modelscope.cn/datasets/${MODELSCOPE_REPO}.git" HEAD >/dev/null 2>&1; then
            echo "public read: ok"
          else
            echo "public read: failed"
          fi
          for user in "$MODELSCOPE_USERNAME" "oauth2"; do
            if GIT_TERMINAL_PROMPT=0 git ls-remote "https://${user}:${MODELSCOPE_TOKEN}@www.modelscope.cn/datasets/${MODELSCOPE_REPO}.git" HEAD >/dev/null 2>&1; then
              echo "auth as ${user}: ok"
            else
              echo "auth as ${user}: failed"
            fi
          done
      - name: 上传到 ModelScope
        env:
          MODELSCOPE_USERNAME: HQZMSu
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
          MODELSCOPE_REPO: HQZMSu/lean4-assets
        run: |
          if [ "${{ inputs.verify_only }}" = "true" ]; then
            pnpm run upload:modelscope -- --verify-only
          else
            pnpm run upload:modelscope
          fi
