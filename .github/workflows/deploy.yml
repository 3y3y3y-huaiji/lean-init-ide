name: Deploy · 应用
run-name: Deploy · ${{ github.ref_name }}

# PR CI（static / test / build / e2e / audit / actionlint）已经在合并前跑过；
# main 上只做构建、部署和线上冒烟，不再重复整条 CI。
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  gate:
    name: 判断来源
    runs-on: ubuntu-latest
    outputs:
      direct: ${{ steps.detect.outputs.direct }}
    steps:
      - name: 是否为 PR 合并提交
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          merged=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '[.[] | select(.merged_at != null)] | length')
          if [ "$merged" -gt 0 ]; then
            echo "direct=false" >> "$GITHUB_OUTPUT"
            echo "PR merge commit: PR CI already covered it"
          else
            echo "direct=true" >> "$GITHUB_OUTPUT"
            echo "direct push: run CI before deploy"
          fi

  ci:
    name: 直接 push 的 CI
    needs: gate
    if: github.ref == 'refs/heads/main' && needs.gate.outputs.direct == 'true'
    uses: ./.github/workflows/ci.yml

  deploy:
    name: 部署
    needs: [gate, ci]
    # PR 合并：PR CI 已经跑过，直接部署。
    # 直接 push：先在 ci job 里复用完整 CI，通过后才部署。
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      vars.CD_ENABLED == 'true' &&
      needs.gate.result == 'success' &&
      (needs.gate.outputs.direct == 'false' || needs.ci.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 主机参数
        uses: ./.github/actions/host-info
      - uses: pnpm/action-setup@v6
        with:
          version: 12.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 认证失败时 wrangler 只回一句 9106，看不出是 token 值坏了还是权限不够。
      - name: 诊断部署凭据
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "token 长度: ${#TOKEN}"
          case "$TOKEN" in
            *[[:space:]]*) echo "token 含空白字符，多半是复制时带了换行或空格"; exit 1 ;;
            *) echo "token 无空白字符" ;;
          esac
          echo "account id 长度: ${#ACCOUNT}"
          code=$(curl -s -o /tmp/probe.json -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/pages/projects")
          echo "API 状态码: $code"
          head -c 400 /tmp/probe.json
          echo
          [ "$code" = "200" ] || exit 1
      # 必须用完整 build：build:web 会跳过约 102 MB 兜底副本，丢掉 SW 的第三级回退。
      - name: 缓存 Lean 资产
        uses: actions/cache@v6
        with:
          path: public/wasm-lean4
          key: lean-assets-${{ hashFiles('config/lean4-runtime.json') }}
      - run: pnpm run build
      - run: pnpm run verify:build
      - name: 推送到 Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm dlx wrangler@4 pages deploy dist --project-name=lean-init-ide --branch=main
      # 部署是原子的，但自定义域传播需要几秒，失败重试而不是立刻判定发布失败。
      # 打 pages.dev 而不是主域：CI 的机房 IP 会被 zone 的机器人规则拦成 403，
      # 那是安全策略生效，不代表产物有问题。
      - name: 线上冒烟
        env:
          LEAN_SITE_ORIGIN: https://lean-init-ide.pages.dev
        run: |
          for attempt in 1 2 3 4 5; do
            if node scripts/smoke.mjs; then
              exit 0
            fi
            echo "第 ${attempt} 次冒烟未通过，10 秒后重试"
            sleep 10
          done
          echo "冒烟连续失败，请按 README 的回滚步骤处理"
          exit 1
