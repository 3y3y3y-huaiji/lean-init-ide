name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: 静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 代码格式
        run: npm run format:check
      - name: ESLint
        run: npm run lint
      - name: 类型检查（应用 / Service Worker / Pages Functions）
        run: npm run typecheck
      - name: 资产清单结构
        run: npm run verify:manifest

  test:
    name: 单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 覆盖率阈值写在 vitest.config.ts，低于阈值即失败。
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  build:
    name: 构建产物
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # build:web 跳过 143 MB 资产下载，运行时由 /cdn 网关按需拉取。
      - run: npm run build:web
      - name: 产物契约
        run: npm run verify:build

  audit:
    name: 依赖审计
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 只审生产依赖：开发工具链的告警不阻塞发布，但会在日志里可见。
      - name: 生产依赖高危漏洞
        run: npm audit --omit=dev --audit-level=high
